<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はさみ将棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;background:#f0ead6;padding:12px}
h1{color:#5a3a1a;margin:4px 0 8px;font-size:1.3em}
.info{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.tag{background:#fff;border:2px solid #8b6914;border-radius:4px;padding:4px 12px;font-weight:bold;font-size:.88em}
#turn{background:#ffe;border:2px solid #8b6914;border-radius:4px;padding:4px 12px;font-weight:bold;font-size:.88em;min-width:110px;text-align:center}
.board{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #5a3a1a;width:min(92vw,480px);aspect-ratio:1;background:#d4a857;margin:8px 0}
.cell{display:flex;align-items:center;justify-content:center;border:1px solid #5a3a1a;cursor:pointer;font-size:min(3.8vw,21px);user-select:none;-webkit-user-select:none;transition:background .15s;touch-action:manipulation}
.cell.h{color:#1a1a8a}
.cell.p{color:#8a0a0a}
.cell.sel{background:#ffe066!important;box-shadow:inset 0 0 6px rgba(0,0,0,.3)}
.cell.lg{background:rgba(0,190,0,.3)}
.cell.lg:hover{background:rgba(0,190,0,.5)}
.cell.lm{background:rgba(255,140,0,.25)}
#msg{display:none;padding:12px 24px;background:#ffe066;border:3px solid #5a3a1a;border-radius:8px;font-size:1.15em;font-weight:bold;margin:8px 0;text-align:center}
.rst{padding:7px 20px;font-size:.95em;cursor:pointer;background:#8b6914;color:#fff;border:none;border-radius:4px;margin-top:6px}
.rst:hover{background:#a07818}
.rules{max-width:min(92vw,480px);margin-top:14px;font-size:.8em;color:#666;line-height:1.6}
.rules summary{cursor:pointer;font-weight:bold;color:#5a3a1a;padding:4px 0}
@media(max-width:400px){.info{gap:6px}.tag,#turn{padding:3px 7px;font-size:.78em}}
</style>
</head>
<body>
<h1>はさみ将棋</h1>
<div class="info">
    <span class="tag">あなた (歩): <b id="hs">0</b></span>
    <span id="turn">あなたの番</span>
    <span class="tag">CPU (と): <b id="cs">0</b></span>
</div>
<div class="board" id="bd"></div>
<div id="msg"></div>
<button class="rst" onclick="reset()">リセット</button>
<details class="rules">
<summary>ルール</summary>
<p>・駒は飛車のように縦横に何マスでも移動（他の駒は飛び越え不可）</p>
<p>・自分の駒で相手の駒の連続列の両端を挟むと取ります（複数方向同時可）</p>
<p>・四隅の相手の駒は、隣接する2マスを自分の駒で塞ぐと取ります</p>
<p>・相手の駒を5枚取った側が勝ち、手番で合法手がなければ負け</p>
</details>
<script>
const SZ=9, HUM=1, CPU=2;
let board,hS,cS,sel,lgl,isOver,isPl,lastMv;

function reset(){
  board=Array.from({length:SZ},()=>new Array(SZ).fill(0));
  for(let c=0;c<SZ;c++){board[SZ-1][c]=HUM;board[0][c]=CPU;}
  hS=0;cS=0;sel=null;lgl=[];isOver=false;isPl=true;lastMv=null;
  document.getElementById('msg').style.display='none';
  draw();ui();
}

function legalMoves(r,c,brd){
  const a=[];
  for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
    let nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<SZ&&nc>=0&&nc<SZ&&brd[nr][nc]===0){
      a.push({r:nr,c:nc});nr+=dr;nc+=dc;
    }
  }
  return a;
}

function anyLegal(p,brd){
  for(let r=0;r<SZ;r++)for(let c=0;c<SZ;c++)
    if(brd[r][c]===p&&legalMoves(r,c,brd).length)return true;
  return false;
}

function findCaps(mr,mc,p,brd){
  const out=[],o=3-p;
  for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
    let nr=mr+dr,nc=mc+dc;const ch=[];
    while(nr>=0&&nr<SZ&&nc>=0&&nc<SZ){
      if(brd[nr][nc]===p){
        for(const q of ch)if(!out.find(x=>x.r===q.r&&x.c===q.c))out.push(q);
        break;
      }
      if(brd[nr][nc]===o)ch.push({r:nr,c:nc});else break;
      nr+=dr;nc+=dc;
    }
  }
  for(const[cr,cc]of[[0,0],[0,8],[8,0],[8,8]]){
    if(brd[cr][cc]===o){
      const ad=[];
      if(cr===0)ad.push([1,cc]);else ad.push([7,cc]);
      if(cc===0)ad.push([cr,1]);else ad.push([cr,7]);
      if(ad.every(([ar,ac])=>brd[ar][ac]===p))
        if(!out.find(x=>x.r===cr&&x.c===cc))out.push({r:cr,c:cc});
    }
  }
  return out;
}

function applyMove(fr,fc,tr,tc,p,brd){
  brd[fr][fc]=0;brd[tr][tc]=p;
  const cap=findCaps(tr,tc,p,brd);
  for(const c of cap)brd[c.r][c.c]=0;
  return cap;
}

function draw(){
  const bd=document.getElementById('bd');bd.innerHTML='';
  for(let r=0;r<SZ;r++)for(let c=0;c<SZ;c++){
    const d=document.createElement('div');d.className='cell';
    if(board[r][c]===HUM){d.textContent='歩';d.classList.add('h');}
    else if(board[r][c]===CPU){d.textContent='と';d.classList.add('p');}
    if(sel&&sel.r===r&&sel.c===c)d.classList.add('sel');
    if(lgl.some(m=>m.r===r&&m.c===c))d.classList.add('lg');
    if(lastMv&&((lastMv.fr===r&&lastMv.fc===c)||(lastMv.tr===r&&lastMv.tc===c)))d.classList.add('lm');
    d.addEventListener('click',()=>onCell(r,c));
    bd.appendChild(d);
  }
}

function ui(){
  document.getElementById('hs').textContent=hS;
  document.getElementById('cs').textContent=cS;
  const t=document.getElementById('turn');
  t.textContent=isOver?'ゲーム終了':(isPl?'あなたの番':'CPU 思考中...');
}

function showOver(msg){
  isOver=true;sel=null;lgl=[];
  const el=document.getElementById('msg');
  el.textContent=msg;el.style.display='block';
  draw();ui();
}

function onCell(r,c){
  if(isOver||!isPl)return;
  if(sel&&lgl.some(m=>m.r===r&&m.c===c)){
    const f=sel;
    const cap=applyMove(f.r,f.c,r,c,HUM,board);
    hS+=cap.length;lastMv={fr:f.r,fc:f.c,tr:r,tc:c};
    sel=null;lgl=[];isPl=false;
    draw();ui();
    if(hS>=5){showOver('あなたの勝ち！');return;}
    if(!anyLegal(CPU,board)){showOver('あなたの勝ち！（CPUに合法手なし）');return;}
    ui();setTimeout(cpuTurn,600);return;
  }
  if(board[r][c]===HUM){
    if(sel&&sel.r===r&&sel.c===c){sel=null;lgl=[];}
    else{sel={r,c};lgl=legalMoves(r,c,board);}
    draw();return;
  }
  if(sel){sel=null;lgl=[];draw();}
}

function cpuTurn(){
  if(isOver)return;
  const all=[];
  for(let r=0;r<SZ;r++)for(let c=0;c<SZ;c++)
    if(board[r][c]===CPU)
      for(const m of legalMoves(r,c,board))
        all.push({fr:r,fc:c,tr:m.r,tc:m.c});
  if(!all.length){showOver('あなたの勝ち！');return;}

  let best=all[0],bestScore=-Infinity;
  for(const mv of all){
    const sim=board.map(r=>[...r]);
    const cap=applyMove(mv.fr,mv.fc,mv.tr,mv.tc,CPU,sim);
    const capScore=cap.length*100;
    const threat=maxThreat(sim);
    const threatScore=threat*50;
    const center=-Math.abs(mv.tr-4)*2-Math.abs(mv.tc-4)*2;
    const score=capScore-threatScore+center+Math.random()*5;
    if(score>bestScore){bestScore=score;best=mv;}
  }

  const cap=applyMove(best.fr,best.fc,best.tr,best.tc,CPU,board);
  cS+=cap.length;lastMv={fr:best.fr,fc:best.fc,tr:best.tr,tc:best.tc};
  isPl=true;draw();ui();
  if(cS>=5){showOver('CPU の勝ち！');return;}
  if(!anyLegal(HUM,board)){showOver('CPU の勝ち！（あなたの合法手なし）');return;}
  ui();
}

function maxThreat(brd){
  let max=0;
  for(let r=0;r<SZ;r++)for(let c=0;c<SZ;c++)
    if(brd[r][c]===HUM)
      for(const m of legalMoves(r,c,brd)){
        const sim=brd.map(r=>[...r]);
        const cap=applyMove(r,c,m.r,m.c,HUM,sim);
        if(cap.length>max)max=cap.length;
      }
  return max;
}

reset();
</script>
</body>
</html>

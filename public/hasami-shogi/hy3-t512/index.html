<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はさみ将棋</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: sans-serif;
    background: #f4f1e9;

    margin-top: 10px;
    font-size: 1.1rem;
    font-weight: bold;
    min-height: 1.4em;
  }
</style>

<body>
<h1>はさみ将棋</h1>
<div class="info">
  <div>あなた(歩) 取った: <span id="cap0">0</span></div>
  <div>CPU(と) 取った: <span id="cap1">0</span></div>
</div>
<div class="board" id="board"></div>
<div class="controls">
  <div id="turn">あなたの番</div>
  <button id="reset">リセット</button>
</div>
<div class="msg" id="msg"></div>

<script>
(function(){
  const N = 9;
  const EMPTY = 0, P0 = 1, P1 = 2; // P0:人間(歩), P1:CPU(と)
  let board, turn, caps, selected, finished;

  const boardEl = document.getElementById('board');
  const turnEl = document.getElementById('turn');
  const msgEl = document.getElementById('msg');
  const cap0El = document.getElementById('cap0');
  const cap1El = document.getElementById('cap1');

  function init(){
    board = Array.from({length:N}, ()=>Array(N).fill(EMPTY));
    for(let c=0;c<N;c++){
      board[N-1][c] = P0;
      board[0][c] = P1;
    }
    turn = P0;
    caps = {[P0]:0, [P1]:0};
    selected = null;
    finished = false;
    msgEl.textContent = '';
    turnEl.textContent = 'あなたの番';
    cap0El.textContent = '0';
    cap1El.textContent = '0';
    render();
  }

  function render(){
    boardEl.innerHTML = '';
    for(let r=0;r<N;r++){
      for(let c=0;c<N;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        const v = board[r][c];
        if(v===P0){ cell.textContent='歩'; cell.classList.add('p0'); }
        if(v===P1){ cell.textContent='と'; cell.classList.add('p1'); }
        if(selected && selected.r===r && selected.c===c) cell.classList.add('sel');
        if(selected && canMove(selected.r, selected.c, r, c)) cell.classList.add('hl');
        cell.addEventListener('click', ()=>onClick(r,c));
        boardEl.appendChild(cell);
      }
    }
  }

  function inB(r,c){ return r>=0&&r<N&&c>=0&&c<N; }

  function canMove(r,c,tr,tc){
    if(!inB(tr,tc)) return false;
    if(board[tr][tc]!==EMPTY) return false;
    if(r===tr && c===tc) return false;
    if(r!==tr && c!==tc) return false; // 縦か横のみ
    const dr = Math.sign(tr-r), dc = Math.sign(tc-c);
    let rr=r+dr, cc=c+dc;
    while(rr!==tr || cc!==tc){
      if(board[rr][cc]!==EMPTY) return false;
      rr+=dr; cc+=dc;
    }
    return true;
  }

  function legalMovesFor(r,c){
    const res=[];
    for(let tr=0;tr<N;tr++) for(let tc=0;tc<N;tc++){
      if(canMove(r,c,tr,tc)) res.push({r:tr,c:tc});
    }
    return res;
  }

  function allLegalMoves(player){
    const res=[];
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(board[r][c]===player){
        legalMovesFor(r,c).forEach(m=>res.push({fr:r,fc:c,tr:m.r,tc:m.c}));
      }
    }
    return res;
  }

  // 挟み判定: playerが(fr,fc)->(tr,tc)移動後の捕獲マス集合
  function capturesAfter(tr,tc,player){
    const enemy = player===P0?P1:P0;
    const caught = new Set();
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dr,dc] of dirs){
      // 直線上の両端チェック
      let rr=tr+dr, cc=tc+dc;
      let line=[];
      while(inB(rr,cc)){
        if(board[rr][cc]===enemy){ line.push([rr,cc]); }
        else break;
        rr+=dr; cc+=dc;
      }
      if(line.length>0 && inB(rr,cc) && board[rr][cc]===player){
        line.forEach(([a,b])=>caught.add(a+','+b));
      }
    }
    // 角の取り: 四隅
    const corners = [[0,0],[0,N-1],[N-1,0],[N-1,N-1]];
    for(const [cr,cc] of corners){
      if(board[cr][cc]===enemy){
        const neigh=[];
        if(cr===0) neigh.push([1,cc]); else if(cr===N-1) neigh.push([N-2,cc]);
        if(cc===0) neigh.push([cr,1]); else if(cc===N-1) neigh.push([cr,N-2]);
        if(neigh.length===2 && neigh.every(([a,b])=>board[a][b]===player)){
          caught.add(cr+','+cc);
        }
      }
    }
    return caught;
  }

  function applyMove(fr,fc,tr,tc,player){
    board[tr][tc]=player;
    board[fr][fc]=EMPTY;
    const caught = capturesAfter(tr,tc,player);
    caught.forEach(k=>{
      const [a,b]=k.split(',').map(Number);
      board[a][b]=EMPTY;
      caps[player]++;
    });
    return caught.size;
  }

  function checkWin(){
    if(caps[P0]>=5){ finish('あなたの勝ち！'); return true; }
    if(caps[P1]>=5){ finish('CPUの勝ち'); return true; }
    return false;
  }

  function finish(text){
    finished = true;
    msgEl.textContent = text;
    turnEl.textContent = '終了';
  }

  function onClick(r,c){
    if(finished || turn!==P0) return;
    if(selected){
      if(selected.r===r && selected.c===c){
        selected=null; render(); return;
      }
      if(board[r][c]===P0){
        selected={r,c}; render(); return;
      }
      if(canMove(selected.r,selected.c,r,c)){
        applyMove(selected.r,selected.c,r,c,P0);
        selected=null;
        cap0El.textContent=caps[P0];
        if(checkWin()) return;
        turn=P1; turnEl.textContent='CPU思考中'; render();
        setTimeout(cpuTurn, 400);
        return;
      }
      selected=null; render(); return;
    } else {
      if(board[r][c]===P0){
        selected={r,c}; render();
      }
    }
  }

  function cpuTurn(){
    if(finished) return;
    const moves = allLegalMoves(P1);
    if(moves.length===0){ finish('あなたの勝ち！(CPU手詰まり)'); return; }
    // 評価: 取れる数、取られるリスク
    let best=null, bestScore=-1e9;
    for(const m of moves){
      const sim = board.map(row=>row.slice());
      const bak = {...caps};
      // 仮適用
      sim[m.tr][m.tc]=P1; sim[m.fr][m.fc]=EMPTY;
      const caught = capturesAfterSim(sim,m.tr,m.tc,P1);
      let score = caught.size*10;
      // 自分が取られるリスク: 人間が次に取れる最大
      let risk=0;
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        if(sim[r][c]===P0){
          const cm = capturesAfterSim(sim,r,c,P0);
          if(cm.size>risk) risk=cm.size;
        }
      }
      score -= risk*8;
      if(score>bestScore){ bestScore=score; best=m; }
    }
    if(best){
      applyMove(best.fr,best.fc,best.tr,best.tc,P1);
      cap1El.textContent=caps[P1];
      if(checkWin()) return;
      turn=P0; turnEl.textContent='あなたの番'; render();
      // 人間手詰まり
      if(allLegalMoves(P0).length===0){ finish('CPUの勝ち(あなた手詰まり)'); }
    }
  }

  function capturesAfterSim(sim,tr,tc,player){
    const enemy = player===P0?P1:P0;
    const caught = new Set();
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dr,dc] of dirs){
      let rr=tr+dr, cc=tc+dc, line=[];
      while(rr>=0&&rr<N&&cc>=0&&cc<N){
        if(sim[rr][cc]===enemy) line.push([rr,cc]);
        else break;
        rr+=dr; cc+=dc;
      }
      if(line.length>0 && rr>=0&&rr<N&&cc>=0&&cc<N && sim[rr][cc]===player){
        line.forEach(([a,b])=>caught.add(a+','+b));
      }
    }
    const corners=[[0,0],[0,N-1],[N-1,0],[N-1,N-1]];
    for(const [cr,cc] of corners){
      if(sim[cr][cc]===enemy){
        const neigh=[];
        if(cr===0) neigh.push([1,cc]); else if(cr===N-1) neigh.push([N-2,cc]);
        if(cc===0) neigh.push([cr,1]); else if(cc===N-1) neigh.push([cr,N-2]);
        if(neigh.length===2 && neigh.every(([a,b])=>sim[a][b]===player)) caught.add(cr+','+cc);
      }
    }
    return caught;
  }

  document.getElementById('reset').addEventListener('click', init);
  init();
})();
</script>
</body>
</html>

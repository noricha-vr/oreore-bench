<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HIBANA — 不死鳥スクロール没入型LP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --dawn-bg: #f2ecf5;
            --dawn-wing: #b9a6e0;
            --orb: #e8f0a8;
            --flame: #ff7a2f;
            --ember: #ffb36b;
            --night: #0a1030;
            --feather: #7fb8ff;
            --sunset: #c23a1f;
            --ink: #2a2438;
            --font-serif: 'Cormorant Garamond', serif;
            --font-jp: 'Shippori Mincho', serif;
            --font-ui: 'Zen Kaku Gothic New', sans-serif;
        }
        html {
            scroll-behavior: auto;
        }
        body {
            background: var(--dawn-bg);
            font-family: var(--font-serif);
            color: var(--ink);
            overflow-x: hidden;
            line-height: 1.5;
            letter-spacing: 0.04em;
        }
        #scroll-container {
            height: 900vh;
            /* 6 scenes × 150vh */
            position: relative;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        #main-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* UI overlay */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            pointer-events: none;
            font-family: var(--font-ui);
            font-weight: 300;
            color: var(--ink);
        }
        #logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.2rem;
            letter-spacing: 0.15em;
            font-weight: 400;
        }
        #logo svg {
            width: 1.4rem;
            height: 1.4rem;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.2;
        }
        #logo .sub {
            font-size: 0.7rem;
            opacity: 0.7;
            letter-spacing: 0.1em;
            margin-left: 0.3rem;
        }
        #nav {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 1.8rem;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        #nav a {
            text-decoration: none;
            color: inherit;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        #nav a:hover {
            opacity: 1;
        }
        #progress-bar {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 30vw;
            height: 1px;
            background: rgba(42, 36, 56, 0.2);
            border-radius: 2px;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--flame);
            transition: width 0.1s linear;
        }
        #sound-ring {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            width: 3rem;
            height: 3rem;
            border: 1px solid rgba(42, 36, 56, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: auto;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
        }
        #sound-ring.visible {
            opacity: 1;
        }
        /* Scene layers */
        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease-out;
            will-change: opacity, transform;
        }
        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }
        .scene-inner {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6vw;
        }
        /* Text styling */
        .poem {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: clamp(1.4rem, 3.2vw, 2.6rem);
            line-height: 1.5;
            letter-spacing: 0.04em;
            color: var(--ink);
            max-width: 70%;
        }
        .poem .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            transition-delay: calc(var(--i) * 60ms);
            margin-right: 0.15em;
        }
        .scene.active .poem .word {
            opacity: 1;
            transform: translateY(0);
        }
        .jp-text {
            font-family: var(--font-jp);
            font-weight: 400;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            line-height: 1.7;
            letter-spacing: 0.08em;
            color: var(--ink);
        }
        .jp-text .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            transition-delay: calc(var(--i) * 60ms);
        }
        .scene.active .jp-text .word {
            opacity: 1;
            transform: translateY(0);
        }
        /* Scene-specific */
        #scene-dawn {
            background: var(--dawn-bg);
        }
        #scene-dawn .poem {
            position: absolute;
            right: 6vw;
            top: 50%;
            transform: translateY(-50%);
            text-align: right;
            max-width: 40%;
        }
        #scene-rise {
            background: linear-gradient(180deg, #f2ecf5 0%, #ffd9b3 40%, #ff9a5c 100%);
        }
        #scene-rise .jp-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 500;
            letter-spacing: 0.2em;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 122, 47, 0.5);
        }
        #scene-halo {
            background: radial-gradient(circle, rgba(255, 200, 150, 0.8) 0%, rgba(255, 150, 100, 0.4) 30%, rgba(100, 50, 80, 0.6) 70%, var(--night) 100%);
        }
        #scene-halo .jp-text {
            font-size: clamp(4rem, 10vw, 8rem);
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 40px rgba(255, 200, 100, 0.8);
            letter-spacing: 0.1em;
        }
        #scene-feather {
            background: var(--night);
        }
        #scene-feather .poem {
            position: absolute;
            bottom: 15vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            max-width: 80%;
        }
        #scene-feather .jp-text {
            position: absolute;
            left: 8vw;
            top: 20vh;
            writing-mode: vertical-rl;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            letter-spacing: 0.2em;
        }
        #scene-feather .jp-text.right {
            left: auto;
            right: 8vw;
            top: 40vh;
        }
        #scene-crystal {
            background: var(--night);
        }
        #scene-crystal .crystal-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10vw;
            perspective: 800px;
        }
        .crystal {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(127, 184, 255, 0.3), rgba(255, 255, 255, 0.1), rgba(255, 122, 47, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(127, 184, 255, 0.3);
            transform-style: preserve-3d;
            animation: rotate-crystal 8s infinite linear;
            transition: transform 0.3s;
        }
        .crystal:hover {
            animation-play-state: paused;
            transform: scale(1.05) rotateY(15deg) rotateX(10deg);
        }
        .crystal::before,
        .crystal::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border: inherit;
            box-shadow: inherit;
        }
        .crystal::before {
            transform: rotateY(60deg);
        }
        .crystal::after {
            transform: rotateY(-60deg);
        }
        @keyframes rotate-crystal {
            0% {
                transform: rotateY(0deg) rotateX(0deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(360deg);
            }
        }
        #scene-finale {
            background: linear-gradient(180deg, #2a1a3a 0%, #c23a1f 50%, #ff7a2f 100%);
        }
        #scene-finale .poem {
            position: absolute;
            bottom: 15vh;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #fff;
            font-size: clamp(1.4rem, 3vw, 2.4rem);
            text-shadow: 0 0 20px rgba(255, 122, 47, 0.7);
            max-width: 80%;
        }
        /* Responsive */
        @media (max-width: 768px) {
            #nav {
                display: none;
            }
            #logo .sub {
                display: none;
            }
            .poem {
                max-width: 85%;
            }
            #scene-dawn .poem {
                max-width: 70%;
                right: 4vw;
            }
            #scene-feather .jp-text {
                font-size: 0.8rem;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="scroll-container"></div>
    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
    </div>
    <div id="ui-overlay">
        <div id="logo">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M12 2C8 6 4 10 4 15c0 4 4 7 8 7s8-3 8-7c0-5-4-9-8-13z" stroke="currentColor" fill="none" stroke-width="1.5"/>
                <circle cx="12" cy="15" r="2" fill="currentColor"/>
            </svg>
            <span>HIBANA</span>
            <span class="sub">Sept. 29</span>
        </div>
        <div id="nav">
            <a href="#">作品</a>
            <a href="#">思想</a>
            <a href="#">接続</a>
        </div>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="sound-ring" class="visible">♪</div>
    </div>

    <!-- Scenes -->
    <div id="scene-dawn" class="scene active" data-scene="0">
        <div class="scene-inner">
            <div class="poem" id="dawn-poem">
                <span class="word" style="--i:0">what</span>
                <span class="word" style="--i:1">guides</span>
                <span class="word" style="--i:2">us</span>
                <span class="word" style="--i:3">through</span>
                <span class="word" style="--i:4">change,</span>
                <br>
                <span class="word" style="--i:5">reinvention,</span>
                <span class="word" style="--i:6">and</span>
                <span class="word" style="--i:7">the</span>
                <span class="word" style="--i:8">unknown—</span>
            </div>
        </div>
    </div>
    <div id="scene-rise" class="scene" data-scene="1">
        <div class="scene-inner">
            <div class="jp-text">
                <span class="word" style="--i:0">再生である。</span>
            </div>
        </div>
    </div>
    <div id="scene-halo" class="scene" data-scene="2">
        <div class="scene-inner">
            <div class="jp-text">
                <span class="word" style="--i:0">音</span>
            </div>
        </div>
    </div>
    <div id="scene-feather" class="scene" data-scene="3">
        <div class="scene-inner">
            <div class="jp-text left">
                <span class="word" style="--i:0">羽根は</span><br>
                <span class="word" style="--i:1">光を</span><br>
                <span class="word" style="--i:2">集めて</span><br>
                <span class="word" style="--i:3">落ちる</span>
            </div>
            <div class="jp-text right">
                <span class="word" style="--i:4">夜に</span><br>
                <span class="word" style="--i:5">浮かぶ</span><br>
                <span class="word" style="--i:6">青い</span><br>
                <span class="word" style="--i:7">炎</span>
            </div>
            <div class="poem">
                <span class="word" style="--i:8">don't just</span>
                <span class="word" style="--i:9">speak</span>
                <span class="word" style="--i:10">to us.</span>
                <span class="word" style="--i:11">they</span>
                <span class="word" style="--i:12">stimulate</span>
                <span class="word" style="--i:13">us.</span>
                <br>
                <span class="word" style="--i:14">light</span>
                <span class="word" style="--i:15">becomes</span>
                <span class="word" style="--i:16">私、</span>
                <span class="word" style="--i:17">flare。</span>
            </div>
        </div>
    </div>
    <div id="scene-crystal" class="scene" data-scene="4">
        <div class="scene-inner">
            <div class="crystal-container">
                <div class="crystal"></div>
                <div class="crystal" style="animation-delay: -3s; width: 90px; height: 90px;"></div>
                <div class="crystal" style="animation-delay: -5s; width: 70px; height: 70px;"></div>
            </div>
        </div>
    </div>
    <div id="scene-finale" class="scene" data-scene="5">
        <div class="scene-inner">
            <div class="poem">
                <span class="word" style="--i:0">feel</span>
                <span class="word" style="--i:1">their</span>
                <span class="word" style="--i:2">heat.</span>
                <span class="word" style="--i:3">焔と</span>
                <span class="word" style="--i:4">interact</span>
                <span class="word" style="--i:5">with。</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            // ====== Canvas setup ======
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d');
            let W = window.innerWidth;
            let H = window.innerHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            ctx.scale(dpr, dpr);

            // ====== Scroll tracking ======
            const scrollContainer = document.getElementById('scroll-container');
            const totalScroll = scrollContainer.offsetHeight - window.innerHeight;
            let targetScroll = 0;
            let currentScroll = 0;
            let currentScene = 0;
            const scenes = document.querySelectorAll('.scene');
            const sceneCount = scenes.length;
            const progressFill = document.getElementById('progress-fill');

            // ====== Particle system ======
            const particles = [];
            const MAX_PARTICLES = 300;
            let activeEmitter = null;

            // Emitter definitions per scene
            const emitters = [
                // Scene 0: Dawn - gentle floating dust / wing particles
                {
                    type: 'dawn',
                    rate: 0.5,
                    max: 80,
                    spawn: function() {
                        return {
                            x: Math.random() * W * 0.3 + W * 0.1,
                            y: Math.random() * H,
                            vx: (Math.random() - 0.5) * 0.2,
                            vy: (Math.random() - 0.5) * 0.1 - 0.1,
                            size: Math.random() * 3 + 1,
                            color: `rgba(185, 166, 224, ${Math.random() * 0.5 + 0.2})`,
                            life: 1,
                            decay: 0.002 + Math.random() * 0.003,
                            type: 'dust'
                        };
                    }
                },
                // Scene 1: Rise - flame particles rising
                {
                    type: 'rise',
                    rate: 1.5,
                    max: 150,
                    spawn: function() {
                        return {
                            x: W * 0.5 + (Math.random() - 0.5) * 100,
                            y: H + Math.random() * 50,
                            vx: (Math.random() - 0.5) * 0.5,
                            vy: -(Math.random() * 2 + 1),
                            size: Math.random() * 6 + 2,
                            color: `rgba(255, ${Math.floor(Math.random() * 100 + 100)}, 50, ${Math.random() * 0.8 + 0.2})`,
                            life: 1,
                            decay: 0.005 + Math.random() * 0.005,
                            type: 'flame'
                        };
                    }
                },
                // Scene 2: Halo - concentric light particles
                {
                    type: 'halo',
                    rate: 0.8,
                    max: 100,
                    spawn: function() {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = Math.random() * 200 + 50;
                        return {
                            x: W / 2 + Math.cos(angle) * radius,
                            y: H / 2 + Math.sin(angle) * radius,
                            vx: -Math.cos(angle) * 0.3,
                            vy: -Math.sin(angle) * 0.3,
                            size: Math.random() * 4 + 1,
                            color: `rgba(255, 200, 150, ${Math.random() * 0.6 + 0.2})`,
                            life: 1,
                            decay: 0.003,
                            type: 'glow'
                        };
                    }
                },
                // Scene 3: Feather - falling feather particles
                {
                    type: 'feather',
                    rate: 0.4,
                    max: 60,
                    spawn: function() {
                        return {
                            x: W / 2 + (Math.random() - 0.5) * 200,
                            y: -20,
                            vx: (Math.random() - 0.5) * 0.3,
                            vy: Math.random() * 0.5 + 0.3,
                            size: Math.random() * 5 + 2,
                            color: `rgba(127, 184, 255, ${Math.random() * 0.7 + 0.3})`,
                            life: 1,
                            decay: 0.002,
                            type: 'feather',
                            angle: Math.random() * Math.PI * 2,
                            angularVel: (Math.random() - 0.5) * 0.02
                        };
                    }
                },
                // Scene 4: Crystal - subtle sparkles
                {
                    type: 'crystal',
                    rate: 0.3,
                    max: 40,
                    spawn: function() {
                        return {
                            x: Math.random() * W,
                            y: Math.random() * H,
                            vx: (Math.random() - 0.5) * 0.1,
                            vy: (Math.random() - 0.5) * 0.1,
                            size: Math.random() * 2 + 0.5,
                            color: `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.2})`,
                            life: 1,
                            decay: 0.005,
                            type: 'sparkle'
                        };
                    }
                },
                // Scene 5: Finale - phoenix fire particles from wing shape
                {
                    type: 'finale',
                    rate: 2,
                    max: 200,
                    spawn: function() {
                        // Wing shape emitter: approximate with two arcs
                        const wing = Math.random() < 0.5 ? -1 : 1;
                        const baseX = W / 2 + wing * (Math.random() * 150 + 50);
                        const baseY = H / 2 + (Math.random() - 0.5) * 100;
                        return {
                            x: baseX,
                            y: baseY,
                            vx: wing * (Math.random() * 1 + 0.5),
                            vy: -(Math.random() * 2 + 1),
                            size: Math.random() * 8 + 2,
                            color: `rgba(255, ${Math.floor(Math.random() * 100 + 50)}, 0, ${Math.random() * 0.8 + 0.2})`,
                            life: 1,
                            decay: 0.004 + Math.random() * 0.004,
                            type: 'flame'
                        };
                    }
                }
            ];

            function updateEmitter(sceneIndex) {
                if (sceneIndex !== currentScene) return;
                const emitter = emitters[sceneIndex];
                if (!emitter) return;
                // Spawn particles based on rate
                if (Math.random() < emitter.rate && particles.length < MAX_PARTICLES) {
                    particles.push(emitter.spawn());
                }
            }

            // ====== Particle update & draw ======
            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.type === 'feather') {
                        p.angle += p.angularVel;
                        p.vx += Math.sin(p.angle) * 0.01;
                    }
                    if (p.life <= 0 || p.y > H + 50 || p.y < -50 || p.x < -50 || p.x > W + 50) {
                        particles.splice(i, 1);
                        continue;
                    }
                    // Draw
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillStyle = p.color;
                    if (p.type === 'feather') {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.angle);
                        ctx.beginPath();
                        ctx.ellipse(0, 0, p.size * 1.5, p.size * 0.5, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    } else if (p.type === 'flame') {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }

            // ====== Scene management ======
            function updateScene() {
                const scrollRatio = currentScroll / totalScroll;
                const sceneProgress = scrollRatio * sceneCount;
                const newScene = Math.min(sceneCount - 1, Math.floor(sceneProgress));
                if (newScene !== currentScene) {
                    currentScene = newScene;
                    scenes.forEach((scene, idx) => {
                        scene.classList.toggle('active', idx === currentScene);
                    });
                    // Clear particles on scene change
                    particles.length = 0;
                }
                // Update progress bar
                progressFill.style.width = (scrollRatio * 100) + '%';
                // Show sound ring after scene 3
                const soundRing = document.getElementById('sound-ring');
                if (currentScene >= 3) {
                    soundRing.classList.add('visible');
                } else {
                    soundRing.classList.remove('visible');
                }
            }

            // ====== Main animation loop ======
            function animate() {
                // Smooth scroll
                currentScroll += (targetScroll - currentScroll) * 0.08;
                if (Math.abs(targetScroll - currentScroll) < 0.1) {
                    currentScroll = targetScroll;
                }
                updateScene();

                // Clear canvas
                ctx.clearRect(0, 0, W, H);

                // Update emitter
                updateEmitter(currentScene);

                // Update particles
                updateParticles();

                requestAnimationFrame(animate);
            }

            // ====== Event listeners ======
            window.addEventListener('scroll', () => {
                targetScroll = window.scrollY;
            });

            window.addEventListener('resize', () => {
                W = window.innerWidth;
                H = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                ctx.scale(dpr, dpr);
            });

            // ====== Init ======
            // Set scroll container height
            scrollContainer.style.height = (sceneCount * 150) + 'vh';
            // Start animation
            animate();

            // Handle reduced motion
            const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReduced) {
                // Reduce particle density
                MAX_PARTICLES = 75;
                // Stop auto animation? We'll just reduce rate
                emitters.forEach(e => e.rate *= 0.25);
            }

            // Sound ring click (decorative)
            document.getElementById('sound-ring').addEventListener('click', function() {
                this.style.transform = 'scale(1.2)';
                setTimeout(() => this.style.transform = 'scale(1)', 200);
            });

        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Dungeon of the Lost</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #111;
            color: #ddd;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-container {
            background: #000;
            border: 2px solid #444;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #hud {
            background: #222;
            padding: 5px 10px;
            font-size: 14px;
            border-bottom: 1px solid #444;
            white-space: nowrap;
            overflow-x: auto;
        }
        #canvas {
            border: 1px solid #333;
            display: block;
        }
        #message-log {
            background: #111;
            padding: 5px 10px;
            font-size: 12px;
            height: 60px;
            overflow-y: auto;
            border-top: 1px solid #444;
        }
        #message-log div {
            line-height: 1.4;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            flex-direction: column;
            gap: 20px;
        }
        .overlay h1 {
            font-size: 48px;
            color: #ff0;
            text-shadow: 2px 2px #000;
        }
        .overlay p {
            font-size: 18px;
            color: #ccc;
        }
        .overlay .hint {
            font-size: 14px;
            color: #888;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud"></div>
        <canvas id="canvas" width="640" height="400"></canvas>
        <div id="message-log"></div>
    </div>

    <div id="title-screen" class="overlay">
        <h1>Dungeon of the Lost</h1>
        <p>Press Enter or Space to start</p>
        <p class="hint">Arrow keys / WASD to move, 1-9 to use items, Enter to descend stairs, R to restart</p>
    </div>

    <div id="gameover-screen" class="overlay hidden">
        <h1 style="color:#f00;">You Died</h1>
        <p>Press R to restart</p>
    </div>

    <div id="clear-screen" class="overlay hidden">
        <h1 style="color:#0f0;">Dungeon Cleared!</h1>
        <p>Press R to play again</p>
    </div>

    <script>
        // ====== Constants ======
        const MAP_W = 40;
        const MAP_H = 25;
        const TILE_SIZE = 16;
        const FOV_RADIUS = 8;
        const MAX_INV = 9;

        // ====== State ======
        let map = [];
        let explored = [];
        let visible = [];
        let player = {};
        let enemies = [];
        let items = [];
        let stairs = { x: 0, y: 0 };
        let currentFloor = 1;
        let gameState = 'title'; // title, playing, gameover, clear
        let messages = [];

        // ====== Canvas ======
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // ====== Utility ======
        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function overlap(a, b) {
            return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
        }

        // ====== Map Generation ======
        function carveCorridor(x1, y1, x2, y2) {
            let x = x1,
                y = y1;
            while (x !== x2) {
                map[y][x] = 1;
                x += (x2 > x1) ? 1 : -1;
            }
            while (y !== y2) {
                map[y][x] = 1;
                y += (y2 > y1) ? 1 : -1;
            }
            map[y][x] = 1;
        }

        function generateMap() {
            // Initialize
            map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(0));
            explored = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(false));
            visible = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(false));

            // Generate rooms
            let rooms = [];
            let attempts = 0;
            while (rooms.length < 8 && attempts < 200) {
                attempts++;
                let w = randInt(4, 10);
                let h = randInt(3, 8);
                let x = randInt(1, MAP_W - w - 1);
                let y = randInt(1, MAP_H - h - 1);
                let room = { x, y, w, h };
                if (!rooms.some(r => overlap(r, room))) {
                    rooms.push(room);
                    for (let i = y; i < y + h; i++) {
                        for (let j = x; j < x + w; j++) {
                            map[i][j] = 1;
                        }
                    }
                }
            }

            // Connect rooms
            for (let i = 0; i < rooms.length - 1; i++) {
                let r1 = rooms[i];
                let r2 = rooms[i + 1];
                let x1 = r1.x + Math.floor(r1.w / 2);
                let y1 = r1.y + Math.floor(r1.h / 2);
                let x2 = r2.x + Math.floor(r2.w / 2);
                let y2 = r2.y + Math.floor(r2.h / 2);
                carveCorridor(x1, y1, x2, y1);
                carveCorridor(x2, y1, x2, y2);
            }

            // Place stairs in last room
            let lastRoom = rooms[rooms.length - 1];
            stairs = {
                x: lastRoom.x + randInt(0, lastRoom.w - 1),
                y: lastRoom.y + randInt(0, lastRoom.h - 1)
            };
            map[stairs.y][stairs.x] = 2;

            // Place player in first room
            let firstRoom = rooms[0];
            player.x = firstRoom.x + Math.floor(firstRoom.w / 2);
            player.y = firstRoom.y + Math.floor(firstRoom.h / 2);

            // Place enemies
            enemies = [];
            let enemyCount = 5 + currentFloor * 2;
            for (let i = 0; i < enemyCount; i++) {
                let room = rooms[randInt(0, rooms.length - 1)];
                let x = room.x + randInt(0, room.w - 1);
                let y = room.y + randInt(0, room.h - 1);
                if (map[y][x] === 1 && !(x === player.x && y === player.y) && !enemies.some(e => e.x === x && e.y === y)) {
                    let type = Math.random() < 0.6 ? 'slime' : 'goblin';
                    let enemy = {
                        x,
                        y,
                        type,
                        hp: 10 + currentFloor * 3,
                        atk: 3 + currentFloor,
                        exp: 5 + currentFloor * 2
                    };
                    enemies.push(enemy);
                }
            }

            // Place items
            items = [];
            let itemCount = 3 + currentFloor;
            for (let i = 0; i < itemCount; i++) {
                let room = rooms[randInt(0, rooms.length - 1)];
                let x = room.x + randInt(0, room.w - 1);
                let y = room.y + randInt(0, room.h - 1);
                if (map[y][x] === 1 && !(x === player.x && y === player.y) && !items.some(it => it.x === x && it.y === y)) {
                    let type = Math.random() < 0.5 ? 'heal' : 'weapon';
                    let item = {
                        x,
                        y,
                        type,
                        name: type === 'heal' ? 'Potion' : 'Sword',
                        value: type === 'heal' ? 10 : 2
                    };
                    items.push(item);
                }
            }
        }

        // ====== FOV ======
        function hasLineOfSight(x0, y0, x1, y1) {
            let dx = Math.abs(x1 - x0);
            let dy = Math.abs(y1 - y0);
            let sx = x0 < x1 ? 1 : -1;
            let sy = y0 < y1 ? 1 : -1;
            let err = dx - dy;
            let x = x0,
                y = y0;
            while (true) {
                if (x === x1 && y === y1) return true;
                if (map[y][x] === 0) return false;
                let e2 = 2 * err;
                if (e2 > -dy) { err -= dy;
                    x += sx; }
                if (e2 < dx) { err += dx;
                    y += sy; }
            }
        }

        function computeFOV() {
            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    visible[y][x] = false;
                    let dx = x - player.x;
                    let dy = y - player.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist <= FOV_RADIUS && hasLineOfSight(player.x, player.y, x, y)) {
                        visible[y][x] = true;
                        explored[y][x] = true;
                    }
                }
            }
        }

        // ====== Rendering ======
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < MAP_H; y++) {
                for (let x = 0; x < MAP_W; x++) {
                    let px = x * TILE_SIZE;
                    let py = y * TILE_SIZE;
                    let isVis = visible[y][x];
                    let isExp = explored[y][x];

                    // Background
                    if (isVis) {
                        ctx.fillStyle = '#000';
                    } else if (isExp) {
                        ctx.fillStyle = '#1a1a1a';
                    } else {
                        ctx.fillStyle = '#0a0a0a';
                    }
                    ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

                    if (!isVis && !isExp) continue;

                    // Draw tile content
                    let tile = map[y][x];
                    let color = '#888';
                    let char = '';

                    if (tile === 0) {
                        char = '#';
                        color = isVis ? '#666' : '#444';
                    } else if (tile === 2) {
                        char = '>';
                        color = isVis ? '#ff0' : '#aa0';
                    }

                    if (char) {
                        ctx.fillStyle = color;
                        ctx.fillText(char, px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                    }

                    // Items
                    if (isVis) {
                        let item = items.find(it => it.x === x && it.y === y);
                        if (item) {
                            ctx.fillStyle = item.type === 'heal' ? '#0ff' : '#f0f';
                            ctx.fillText(item.type === 'heal' ? '!' : '/', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                        }
                    }

                    // Enemies
                    if (isVis) {
                        let enemy = enemies.find(e => e.x === x && e.y === y && e.hp > 0);
                        if (enemy) {
                            ctx.fillStyle = enemy.type === 'slime' ? '#0f0' : '#f00';
                            ctx.fillText(enemy.type === 'slime' ? 's' : 'g', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                        }
                    }

                    // Player
                    if (isVis && player.x === x && player.y === y) {
                        ctx.fillStyle = '#fff';
                        ctx.fillText('@', px + TILE_SIZE / 2, py + TILE_SIZE / 2);
                    }
                }
            }
        }

        // ====== HUD ======
        function updateHUD() {
            let invText = '';
            for (let i = 0; i < MAX_INV; i++) {
                if (i < player.inventory.length) {
                    let item = player.inventory[i];
                    invText += `[${i + 1}]${item.name} `;
                } else {
                    invText += `[${i + 1}]-- `;
                }
            }
            document.getElementById('hud').innerHTML =
                `HP: ${player.hp}/${player.maxHp} | Lv: ${player.level} | EXP: ${player.exp} | Floor: ${currentFloor} | Inv: ${invText}`;
        }

        // ====== Messages ======
        function addMessage(msg) {
            messages.push(msg);
            if (messages.length > 50) messages.shift();
            let log = document.getElementById('message-log');
            log.innerHTML = messages.slice(-5).map(m => `<div>${m}</div>`).join('');
            log.scrollTop = log.scrollHeight;
        }

        // ====== Combat & Actions ======
        function movePlayer(dx, dy) {
            let nx = player.x + dx;
            let ny = player.y + dy;

            if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) return;
            if (map[ny][nx] === 0) return;

            // Check enemy
            let enemy = enemies.find(e => e.x === nx && e.y === ny && e.hp > 0);
            if (enemy) {
                let dmg = player.atk;
                enemy.hp -= dmg;
                addMessage(`You attack ${enemy.type} for ${dmg} damage`);
                if (enemy.hp <= 0) {
                    addMessage(`${enemy.type} is defeated!`);
                    player.exp += enemy.exp;
                    checkLevelUp();
                    enemies = enemies.filter(e => e !== enemy);
                }
            } else {
                // Move
                player.x = nx;
                player.y = ny;

                // Pick up item
                let itemIndex = items.findIndex(it => it.x === nx && it.y === ny);
                if (itemIndex !== -1) {
                    let item = items[itemIndex];
                    if (player.inventory.length < MAX_INV) {
                        player.inventory.push(item);
                        addMessage(`Picked up ${item.name}`);
                        items.splice(itemIndex, 1);
                    } else {
                        addMessage('Inventory full!');
                    }
                }
            }

            // Enemy turn
            enemyTurn();

            // Check death
            if (player.hp <= 0) {
                player.hp = 0;
                gameState = 'gameover';
                addMessage('You died...');
                showOverlay('gameover-screen');
            }

            computeFOV();
            updateHUD();
            render();
        }

        function enemyTurn() {
            for (let enemy of enemies) {
                if (enemy.hp <= 0) continue;

                let dist = Math.abs(enemy.x - player.x) + Math.abs(enemy.y - player.y);

                if (dist === 1) {
                    // Attack player
                    let dmg = enemy.atk;
                    player.hp -= dmg;
                    addMessage(`${enemy.type} attacks you for ${dmg} damage`);
                    if (player.hp <= 0) {
                        player.hp = 0;
                        gameState = 'gameover';
                        addMessage('You died...');
                        showOverlay('gameover-screen');
                        return;
                    }
                } else if (visible[enemy.y][enemy.x]) {
                    // Move towards player
                    let dx = Math.sign(player.x - enemy.x);
                    let dy = Math.sign(player.y - enemy.y);
                    let candidates = [];
                    if (dx !== 0) candidates.push({ dx, dy: 0 });
                    if (dy !== 0) candidates.push({ dx: 0, dy });
                    // Shuffle
                    for (let i = candidates.length - 1; i > 0; i--) {
                        let j = Math.floor(Math.random() * (i + 1));
                        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                    }
                    for (let c of candidates) {
                        let nx = enemy.x + c.dx;
                        let ny = enemy.y + c.dy;
                        if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H &&
                            map[ny][nx] !== 0 &&
                            !enemies.some(e => e.x === nx && e.y === ny && e.hp > 0) &&
                            !(nx === player.x && ny === player.y)) {
                            enemy.x = nx;
                            enemy.y = ny;
                            break;
                        }
                    }
                } else {
                    // Random move
                    let dirs = [{ dx: 0, dy: 1 }, { dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: -1, dy: 0 }];
                    let dir = dirs[Math.floor(Math.random() * dirs.length)];
                    let nx = enemy.x + dir.dx;
                    let ny = enemy.y + dir.dy;
                    if (nx >= 0 && nx < MAP_W && ny >= 0 && ny < MAP_H &&
                        map[ny][nx] !== 0 &&
                        !enemies.some(e => e.x === nx && e.y === ny && e.hp > 0) &&
                        !(nx === player.x && ny === player.y)) {
                        enemy.x = nx;
                        enemy.y = ny;
                    }
                }
            }
        }

        function checkLevelUp() {
            let expNeeded = player.level * 20;
            while (player.exp >= expNeeded) {
                player.exp -= expNeeded;
                player.level++;
                player.maxHp += 5;
                player.hp = player.maxHp;
                player.atk += 2;
                addMessage(`Level up! Now level ${player.level}`);
                expNeeded = player.level * 20;
            }
        }

        function useItem(index) {
            if (index < 0 || index >= player.inventory.length) return;
            let item = player.inventory[index];
            if (item.type === 'heal') {
                let heal = item.value;
                player.hp = Math.min(player.maxHp, player.hp + heal);
                addMessage(`Used Potion, healed ${heal} HP`);
            } else if (item.type === 'weapon') {
                player.atk += item.value;
                addMessage(`Equipped Sword, attack +${item.value}`);
            }
            player.inventory.splice(index, 1);
            updateHUD();
            render();
        }

        // ====== Stairs ======
        function goDownStairs() {
            if (player.x === stairs.x && player.y === stairs.y) {
                currentFloor++;
                if (currentFloor > 3) {
                    gameState = 'clear';
                    addMessage('You cleared the dungeon!');
                    showOverlay('clear-screen');
                    return;
                }
                generateMap();
                computeFOV();
                addMessage(`You descend to floor ${currentFloor}`);
                updateHUD();
                render();
            }
        }

        // ====== Game Control ======
        function startGame() {
            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('clear-screen').classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            currentFloor = 1;
            player = {
                x: 0,
                y: 0,
                hp: 20,
                maxHp: 20,
                atk: 5,
                level: 1,
                exp: 0,
                inventory: []
            };
            generateMap();
            computeFOV();
            gameState = 'playing';
            messages = [];
            addMessage('Welcome to the Dungeon of the Lost!');
            updateHUD();
            render();
        }

        function showOverlay(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        // ====== Input ======
        document.addEventListener('keydown', (e) => {
            if (gameState === 'title') {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    startGame();
                }
                return;
            }

            if (gameState === 'gameover' || gameState === 'clear') {
                if (e.key === 'r' || e.key === 'R') {
                    startGame();
                }
                return;
            }

            if (gameState !== 'playing') return;

            let dx = 0,
                dy = 0;
            let handled = true;

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    dy = -1;
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    dy = 1;
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    dx = -1;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    dx = 1;
                    break;
                case 'Enter':
                case '>':
                    goDownStairs();
                    break;
                case 'r':
                case 'R':
                    startGame();
                    break;
                default:
                    if (e.key >= '1' && e.key <= '9') {
                        useItem(parseInt(e.key) - 1);
                    } else {
                        handled = false;
                    }
            }

            if (handled) {
                e.preventDefault();
                if (dx !== 0 || dy !== 0) {
                    movePlayer(dx, dy);
                }
            }
        });

        // ====== Initial ======
        // Show title
        document.getElementById('title-screen').classList.remove('hidden');
    </script>
</body>
</html>

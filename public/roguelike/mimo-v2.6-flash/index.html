<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>冥闇ラビリンス</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Courier New',monospace;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#wrap{display:flex;border:2px solid #333}
canvas{display:block;background:#000}
#sb{width:230px;background:#111;padding:8px;display:flex;flex-direction:column;color:#ccc;font-size:13px}
h2{color:#ff0;font-size:16px;margin-bottom:6px;text-align:center;border-bottom:1px solid #444;padding-bottom:4px}
.stat{margin-bottom:5px}
.stat label{color:#888;display:inline-block;width:55px}
.bar{height:12px;background:#222;border:1px solid #444;position:relative;margin-top:1px}
.bar i{display:block;height:100%;transition:width .3s}
.bar span{position:absolute;top:0;left:4px;color:#fff;font-size:11px;line-height:12px;text-shadow:1px 1px #000}
#inv{border-top:1px solid #333;padding-top:5px;margin-top:5px}
#inv div{color:#aaa;padding:1px 2px}
#inv div .key{color:#0ff;display:inline-block;width:18px}
#msgs{border-top:1px solid #333;padding-top:5px;margin-top:5px;flex:1;overflow:hidden}
#msgs div{padding:1px 0;border-bottom:1px solid #1a1a1a;font-size:11px;color:#999}
#msgs div:last-child{color:#fff;border-color:#444}
#msgs div:first-child{color:#ff8}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="640" height="400"></canvas>
<div id="sb">
<h2>冥闇ラビリンス</h2>
<div class="stat"><label>階</label><span id="floorinfo">1 / 3</span></div>
<div class="stat"><label>HP</label><span id="hpinfo"></span></div>
<div class="bar"><i id="hpbar"></i><span id="hpbartxt"></span></div>
<div class="stat"><label>レベル</label><span id="lvinfo">1</span></div>
<div class="stat"><label>経験値</label><span id="xpinfo">0 / 10</span></div>
<div class="bar"><i id="xpbar"></i><span id="xpbartxt">0%</span></div>
<div class="stat"><label>攻撃</label><span id="atkinfo">3</span></div>
<div id="inv"><strong style="color:#888">インベントリ</strong><div id="invitems">-</div></div>
<div id="msgs"></div>
</div>
</div>
<script>
const COLS=40,ROWS=25,MAXF=3,TS=16,SIGHT=8,TW=0,TF=1,TS_up=2;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let phase='title',floor=0,gm=[],en=[],tim=[],inv=[],ms=[],fov=[],seen=[],pl=null,rngState=0;

function initRng(){rngState=(Date.now()^(Math.random()*0xffffffff))>>>0}
function rd(){rngState=(rngState*1664525+1013904223)>>>0;return rngState/4294967296}
function ri(lo,hi){return lo+Math.floor(rd()*(hi-lo+1))}
function pick(a){return a[ri(0,a.length-1)]}

function hLOS(sx,sy,ex,ey){
  if(sx===ex&&sy===ey)return true;
  let dx=Math.abs(ex-sx),dy=Math.abs(ey-sy);
  let ssx=sx<ex?1:-1,ssy=sy<ey?1:-1;
  let err=dx-dy,x=sx,y=sy;
  for(let i=0;i<COLS+ROWS;i++){
    let e2=2*err,nx=x,ny=y;
    if(e2>-dy){err-=dy;nx+=ssx}
    if(e2<dx){err+=dx;ny+=ssy}
    if(nx===ex&&ny===ey)return true;
    x=nx;y=ny;
    if(x<0||x>=COLS||y<0||y>=ROWS)return false;
    if(gm[y][x]===TW)return false;
  }
  return false;
}

function carveH(x1,x2,y){for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(y>=0&&y<ROWS&&x>=0&&x<COLS)gm[y][x]=TF}
function carveV(y1,y2,x){for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)if(y>=0&&y<ROWS&&x>=0&&x<COLS)gm[y][x]=TF}

function initFOV(){fov=[];seen=[];for(let y=0;y<ROWS;y++){fov[y]=[];seen[y]=[];for(let x=0;x<COLS;x++){fov[y][x]=false;seen[y][x]=false}}}
function updateFOV(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)fov[y][x]=false;
  fov[pl.y][pl.x]=true;seen[pl.y][pl.x]=true;
  for(let dy=-SIGHT;dy<=SIGHT;dy++)for(let dx=-SIGHT;dx<=SIGHT;dx++){
    if(dx===0&&dy===0)continue;
    let tx=pl.x+dx,ty=pl.y+dy;
    if(tx<0||tx>=COLS||ty<0||ty>=ROWS)continue;
    if(dx*dx+dy*dy>SIGHT*SIGHT)continue;
    if(hLOS(pl.x,pl.y,tx,ty)){fov[ty][tx]=true;seen[ty][tx]=true}
  }
}

function spawnEnemy(x,y){
  let f=floor,r=rd(),e;
  if(f===1){r<0.5?0:r<1-->0:0} // dummy
  let tp;
  if(f===1)tp=r<0.55?'slime':'bat';
  else if(f===2)tp=r<0.3?'slime':r<0.65?'bat':'orc';
  else tp=r<0.2?'slime':r<0.5?'bat':'orc';

  if(tp==='slime')e={x,y,type:'slime',name:'スライム',char:'s',hp:5+2*f,mhp:5+2*f,atk:1+f,chase:true,xp:3+f};
  else if(tp==='bat')e={x,y,type:'bat',name:'コウモリ',char:'b',hp:3+2*f,mhp:3+2*f,atk:2+f,chase:false,xp:4+f};
  else e={x,y,type:'orc',name:'オーク',char:'O',hp:10+4*f,mhp:10+4*f,atk:3+f,chase:true,xp:8+f};
  en.push(e);
}

function genDungeon(){
  gm=[];for(let y=0;y<ROWS;y++){gm[y]=[];for(let x=0;x<COLS;x++)gm[y][x]=TW}
  initFOV();en=[];tim=[];

  const rooms=[],target=ri(7,9);
  let tries=0;
  while(rooms.length<target&&tries<800){
    tries++;
    let w=ri(5,10),h=ri(4,7),x=ri(1,COLS-w-2),y=ri(1,ROWS-h-2);
    let room={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)};
    let ok=true;
    for(let r of rooms){
      if(x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y){ok=false;break}
    }
    if(!ok)continue;
    for(let ry=y;ry<y+h;ry++)for(let rx=x;rx<x+w;rx++)gm[ry][rx]=TF;
    rooms.push(room);
  }

  for(let i=1;i<rooms.length;i++){
    let a=rooms[i-1],b=rooms[i];
    if(rd()<0.5){carveH(a.cx,b.cx,a.cy);carveV(a.cy,b.cy,b.cx)}
    else{carveV(a.cy,b.cy,a.cx);carveH(a.cx,b.cx,b.cy)}
  }

  let fr=rooms[0],lr=rooms[rooms.length-1];
  gm[lr.cy][lr.cx]=TS_up;
  pl.x=fr.cx;pl.y=fr.cy;

  let nEn=ri(5,7);
  for(let i=0;i<nEn;i++){
    let room=pick(rooms.slice(1));
    let ex=ri(room.x,room.x+room.w-1),ey=ri(room.y,room.y+room.h-1);
    if(gm[ey][ex]!==TF)continue;
    if((ex===pl.x&&ey===pl.y)&&(gm[ey][ex]===TS_up))continue;
    if(en.some(e=>e.x===ex&&e.y===ey))continue;
    spawnEnemy(ex,ey);
  }

  let nIt=ri(3,5);
  for(let i=0;i<nIt;i++){
    let room=pick(rooms.slice(1));
    let ix=ri(room.x,room.x+room.w-1),iy=ri(room.y,room.y+room.h-1);
    if(gm[iy][ix]!==TF)continue;
    if(en.some(e=>e.x===ix&&e.y===iy))continue;
    if(tim.some(it=>it.x===ix&&it.y===iy))continue;
    if(ix===pl.x&&iy===pl.y)continue;
    if(rd()<0.5)tim.push({x:ix,y:iy,type:'potion',name:'回復薬',char:'!'});
    else tim.push({x:ix,y:iy,type:'weapon',name:'武器',char:'/'});
  }

  updateFOV();
  addMsg(floor+'階に入った。');
}

function addMsg(t){ms.push(t);if(ms.length>30)ms.shift();renderMsgs()}

function playerAttack(e){
  let dmg=Math.max(1,ri(1,pl.atk));
  e.hp-=dmg;addMsg(e.name+'に '+dmg+' ダメージを与えた');
  if(e.hp<=0){
    en.splice(en.indexOf(e),1);
    pl.xp+=e.xp;addMsg(e.name+'を倒した　'+e.xp+'EXP獲得');
    while(pl.xp>=pl.nextLvl){
      pl.xp-=pl.nextLvl;pl.level++;
      pl.nextLvl=pl.level*10+5;
      pl.mhp+=5;pl.hp=pl.mhp;pl.atk++;
      addMsg('レベル'+pl.level+'に上がった！HP・攻撃力+');
    }
  }
}

function enemyMoveTo(e,x,y){
  if(x<0||x>=COLS||y<0||y>=ROWS)return false;
  if(gm[y][x]===TW||gm[y][x]===TS_up)return false;
  if(en.some(o=>o!==e&&o.x===x&&o.y===y))return false;
  return true;
}

function moveEnemyToward(e){
  let dx=Math.sign(pl.x-e.x),dy=Math.sign(pl.y-e.y);
  let tries=[[dx,0],[0,dy],[dx,dy]];
  for(let[mx,my]of tries){
    if(mx===0&&my===0)continue;
    let nx=e.x+mx,ny=e.y+my;
    if(nx===pl.x&&ny===pl.y){
      let dmg=Math.max(1,ri(1,e.atk));
      pl.hp-=dmg;addMsg(e.name+'の攻撃で '+dmg+' ダメージ');
      if(pl.hp<=0){pl.hp=0;phase='gameover';addMsg('あなたは倒れた...')}
      return;
    }
    if(enemyMoveTo(e,nx,ny)){e.x=nx;e.y=ny;return}
  }
}

function enemyTurn(){
  let snapshot=[...en];
  for(let e of snapshot){
    if(phase!=='playing')break;
    if(en.indexOf(e)===-1)continue;
    let ch=Math.max(Math.abs(e.x-pl.x),Math.abs(e.y-pl.y));
    if(ch===1){
      let dmg=Math.max(1,ri(1,e.atk));
      pl.hp-=dmg;addMsg(e.name+'の攻撃で '+dmg+' ダメージ');
      if(pl.hp<=0){pl.hp=0;phase='gameover';addMsg('あなたは倒れた...')}
      continue;
    }
    let sees=ch<=SIGHT&&hLOS(e.x,e.y,pl.x,pl.y);
    if(sees&&e.chase){moveEnemyToward(e)}
    else if(sees&&!e.chase){if(rd()<0.3)moveEnemyToward(e);else wander(e)}
    else{if(rd()<0.5)wander(e)}
  }
  if(phase==='gameover')return;
}

function wander(e){
  let d=pick([[0,-1],[0,1],[-1,0],[1,0]]);
  let nx=e.x+d[0],ny=e.y+d[1];
  if(enemyMoveTo(e,nx,ny)&&!(nx===pl.x&&ny===pl.y)){e.x=nx;e.y=ny}
}

function playerMove(dx,dy){
  let tx=pl.x+dx,ty=pl.y+dy;
  if(tx<0||tx>=COLS||ty<0||ty>=ROWS)return false;
  if(gm[ty][tx]===TW)return false;
  let target=en.find(e=>e.x===tx&&e.y===ty);
  if(target){playerAttack(target);return true}
  pl.x=tx;pl.y=ty;
  let item=tim.find(i=>i.x===tx&&i.y===ty);
  if(item){
    if(inv.length<9){
      inv.push(item);tim.splice(tim.indexOf(item),1);
      addMsg(item.name+'を拾った');
    }else addMsg('インベントリが満杯！');
  }
  if(gm[ty][tx]===TS_up)addMsg('階段を見つけた。Enterで降りる');
  return true;
}

function useItem(slot){
  let i=slot-1;
  if(i<0||i>=inv.length)return false;
  let it=inv[i];inv.splice(i,1);
  if(it.type==='potion'){
    let heal=Math.min(10+2*floor,pl.mhp-pl.hp);
    pl.hp+=heal;addMsg('回復薬を使った　'+heal+'HP回復');
  }else{
    let boost=1+(floor>=3?1:0);
    pl.atk+=boost;addMsg('武器を使った　攻撃力+'+boost+' (現在:'+pl.atk+')');
  }
  return true;
}

function descend(){
  if(gm[pl.y][pl.x]!==TS_up)return;
  if(floor===MAXF){phase='clear'}
  else{floor++;genDungeon()}
}

function newGame(){
  initRng();floor=1;
  pl={x:0,y:0,hp:20,mhp:20,atk:3,level:1,xp:0,nextLvl:10};
  inv=[];ms=[];phase='playing';
  genDungeon();render();renderSB();
}

let dX=TS,dY=TS;
function drawCh(ch,x,y,color){
  ctx.fillStyle=color;ctx.font=dY+'px Courier New,monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ch,x*dX+dX/2,y*dY+dY/2);
}

function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,cvs.width,cvs.height);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    let vis=fov[y][x],exp=seen[y][x];
    if(!exp)continue;
    let px=x*dX,py=y*dY,t=gm[y][x];
    if(t===TW){
      ctx.fillStyle=vis?'#444':'#1a1a1a';ctx.fillRect(px,py,dX,dY);
      drawCh('#',x,y,vis?'#777':'#444');
    }else if(t===TF){
      ctx.fillStyle=vis?'#111d2e':'#0d0d11';ctx.fillRect(px,py,dX,dY);
      if(vis)drawCh('.',x,y,'#334455');
    }else if(t===TS_up){
      ctx.fillStyle=vis?'#2a2a11':'#1a1a0d';ctx.fillRect(px,py,dX,dY);
      drawCh('>',x,y,vis?'#ff0':'#880');
    }
    if(vis){
      let item=tim.find(i=>i.x===x&&i.y===y);
      if(item)drawCh(item.char,x,y,item.type==='potion'?'#f55':'#5bf');
      let enemy=en.find(e=>e.x===x&&e.y===y);
      if(enemy){
        let col=enemy.type==='slime'?'#0f0':enemy.type==='bat'?'#0ff':'#f83';
        drawCh(enemy.char,x,y,col);
      }
    }
  }
  drawCh('@',pl.x,pl.y,'#fff');

  if(phase==='title')renderTitle();
  else if(phase==='gameover')renderOver();
  else if(phase==='clear')renderClear();
}

function renderTitle(){
  ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ff0';ctx.font='bold 48px Courier New';
  ctx.fillText('冥闇ラビリンス',320,140);
  ctx.fillStyle='#888';ctx.font='16px Courier New';
  ctx.fillText('深淵の地下牢を見破る者',320,190);
  ctx.fillStyle='#0ff';ctx.font='18px Courier New';
  ctx.fillText('Enter / Space で開始',320,250);
  ctx.fillStyle='#666';ctx.font='13px Courier New';
  ctx.fillText('移動: 矢印キー / WASD',320,290);
  ctx.fillText('アイテム使用: 1〜9  階段: Enter / >  リスタート: R',320,312);
}

function renderOver(){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#f00';ctx.font='bold 44px Courier New';
  ctx.fillText('GAME OVER',320,160);
  ctx.fillStyle='#aaa';ctx.font='16px Courier New';
  ctx.fillText('階数: '+floor+'   レベル: '+pl.level,320,210);
  ctx.fillStyle='#0ff';ctx.font='18px Courier New';
  ctx.fillText('R でリスタート',320,270);
}

function renderClear(){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#0f0';ctx.font='bold 44px Courier New';
  ctx.fillText('CLEAR!',320,140);
  ctx.fillStyle='#ff0';ctx.font='20px Courier New';
  ctx.fillText('深淵の最下層を踏破した！',320,185);
  ctx.fillStyle='#aaa';ctx.font='16px Courier New';
  ctx.fillText('レベル: '+pl.level+'   攻撃力: '+pl.atk+'   HP: '+pl.hp+'/'+pl.mhp,320,225);
  ctx.fillStyle='#0ff';ctx.font='18px Courier New';
  ctx.fillText('R で再挑戦',320,280);
}

function renderSB(){
  document.getElementById('floorinfo').textContent=floor+' / '+MAXF;
  document.getElementById('hpinfo').textContent=pl.hp+' / '+pl.mhp;
  let pct=Math.max(0,pl.hp/pl.mhp*100);
  let bar=document.getElementById('hpbar');
  bar.style.width=pct+'%';
  bar.style.background=pct>60?'#0a0':pct>30?'#cc0':'#c00';
  document.getElementById('hpbartxt').textContent=pl.hp+'/'+pl.mhp;
  document.getElementById('lvinfo').textContent='Lv.'+pl.level;
  document.getElementById('xpinfo').textContent=pl.xp+' / '+pl.nextLvl;
  let xpPct=pl.xp/pl.nextLvl*100;
  document.getElementById('xpbar').style.width=xpPct+'%';
  document.getElementById('xpbar').style.background='#06a';
  document.getElementById('xpbartxt').textContent=Math.floor(xpPct)+'%';
  document.getElementById('atkinfo').textContent=pl.atk;

  let invDiv=document.getElementById('invitems');
  if(inv.length===0){invDiv.innerHTML='<span style="color:#444">(なし)</span>'}
  else{
    invDiv.innerHTML=inv.map((s,i)=>'<div><span class="key">'+(i+1)+'.</span> ['+(s.type==='potion'?'!':'/')+'] '+s.name+'</div>').join('');
  }
}

function renderMsgs(){
  let el=document.getElementById('msgs');
  let start=Math.max(0,ms.length-7);
  el.innerHTML='';
  for(let i=start;i<ms.length;i++){
    let d=document.createElement('div');
    d.textContent=ms[i];
    el.appendChild(d);
  }
}

document.addEventListener('keydown',e=>{
  e.preventDefault();
  let k=e.key;

  if(k==='r'||k==='R'){newGame();return}

  if(phase==='title'){
    if(k==='Enter'||k===' ')newGame();
    return;
  }
  if(phase!=='playing')return;

  let acted=false;

  if(k==='ArrowUp'||k==='w'||k==='W')acted=playerMove(0,-1);
  else if(k==='ArrowDown'||k==='s'||k==='S')acted=playerMove(0,1);
  else if(k==='ArrowLeft'||k==='a'||k==='A')acted=playerMove(-1,0);
  else if(k==='ArrowRight'||k==='d'||k==='D')acted=playerMove(1,0);
  else if(k==='Enter'||k==='>'||k==='.'){
    if(gm[pl.y][pl.x]===TS_up){descend();render();renderSB();return}
  }
  else if(k>='1'&&k<='9'){acted=useItem(+k)}

  if(acted){
    enemyTurn();
    updateFOV();
    render();renderSB();
    if(phase==='gameover'||phase==='clear'){render();renderSB()}
  }
});

render();
</script>
</body>
</html>

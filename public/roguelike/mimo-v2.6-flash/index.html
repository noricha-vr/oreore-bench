<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>深淵の回廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080f;color:#bbb;font-family:'Courier New',Consolas,monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:15px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
#overlay.hide{display:none}
#overlay h1{color:#66aaff;font-size:34px;margin-bottom:22px}
#overlay h1.d{color:#f44}
#overlay h1.w{color:#ff0}
#overlay p{color:#aaa;font-size:14px;line-height:2.2;text-align:center}
#overlay .k{color:#ff0}
#wrap{display:flex;gap:14px;align-items:flex-start}
canvas#map{border:1px solid #334;display:block}
#panel{width:250px;display:flex;flex-direction:column;gap:10px}
#stats,#inv,#log{background:#0d0d14;border:1px solid #2a2a3a;border-radius:4px;padding:8px}
#stats{color:#aaf;font-size:14px;line-height:1.7}
#stats .lo{color:#f44}
#stats .hi{color:#4f4}
#inv{color:#ffa;font-size:13px;line-height:1.6}
#log{color:#777;font-size:12px;line-height:1.5;min-height:130px}
#log .c{color:#f88}
#log .i{color:#8f8}
#log .n{color:#88f}
#log .latest{color:#eee}
</style>
</head>
<body>
<div id="overlay">
  <h1>深淵の回廊</h1>
  <p>
    <span class="k">↑↓←→ / WASD</span> 移動（1ターン）<br>
    <span class="k">1-9</span> インベントリ使用<br>
    <span class="k">Enter / &gt;</span> 階段降りる<br>
    <span class="k">R</span> リスタート<br><br>
    <span class="k">Enter</span> で開始
  </p>
</div>
<div id="wrap">
  <canvas id="map"></canvas>
  <div id="panel">
    <div id="stats"></div>
    <div id="inv"></div>
    <div id="log"></div>
  </div>
</div>
<script>
(function(){
'use strict';

var MW=42,MH=25,TS=16,FOV=8,MAXF=3;
var WALL=0,FLOOR=1,STAIRS=2;

var $c=document.getElementById('map'),ctx=$c.getContext('2d');
$c.width=MW*TS;$c.height=MH*TS;
var $ov=document.getElementById('overlay');
var $h1=$ov.querySelector('h1');
var $p=$ov.querySelector('p');
var $st=document.getElementById('stats');
var $iv=document.getElementById('inv');
var $lg=document.getElementById('log');

var ENT=[
{n:'スライム',c:'s',col:'#4d4',hp:8,a:2,xp:5,ch:1},
{n:'コウモリ',c:'b',col:'#48f',hp:6,a:3,xp:6,ch:1},
{n:'ゴブリン',c:'g',col:'#ca4',hp:12,a:4,xp:8,ch:0},
{n:'スケルトン',c:'k',col:'#ccc',hp:15,a:5,xp:10,ch:0},
{n:'オーガ',c:'O',col:'#f84',hp:25,a:7,xp:18,ch:1}
];
var ITT=[
{n:'回復薬',c:'!',col:'#f44',t:'p',h:15,b:0},
{n:'回復薬(大)',c:'!',col:'#f88',t:'p',h:30,b:0},
{n:'短剣',c:'/',col:'#8af',t:'w',h:0,b:3},
{n:'長剣',c:'/',col:'#aff',t:'w',h:0,b:5}
];

var st,mp,vw,ex,pl,en,it,ms,fl;

function ri(a,b){return a+Math.floor(Math.random()*(b-a))}
function pk(a){return a[Math.floor(Math.random()*a.length)]}

function genD(){
  var y,x;
  mp=[];
  for(y=0;y<MH;y++){mp[y]=[];for(x=0;x<MW;x++)mp[y][x]=WALL}
  var rm=[],n=ri(7,11),i,j,r,w,h,rx,ry,ok;
  for(i=0;i<500&&rm.length<n;i++){
    w=ri(4,10);h=ri(4,9);rx=ri(1,MW-w-1);ry=ri(1,MH-h-1);
    ok=true;
    for(j=0;j<rm.length;j++){
      r=rm[j];
      if(rx<r.x+r.w+1&&rx+w+1>r.x&&ry<r.y+r.h+1&&ry+h+1>r.y){ok=false;break}
    }
    if(!ok)continue;
    for(y=ry;y<ry+h;y++)for(x=rx;x<rx+w;x++)mp[y][x]=FLOOR;
    rm.push({x:rx,y:ry,w:w,h:h,cx:rx+(w>>1),cy:ry+(h>>1)});
  }
  for(i=1;i<rm.length;i++){
    var a=rm[i-1],b=rm[i];
    if(Math.random()<.5){cvH(a.cx,b.cx,a.cy);cvV(a.cy,b.cy,b.cx)}
    else{cvV(a.cy,b.cy,a.cx);cvH(a.cx,b.cx,b.cy)}
  }
  var ext=ri(1,3);
  for(i=0;i<ext;i++){
    var p=pk(rm),q=pk(rm);
    if(p===q)continue;
    if(Math.random()<.5){cvH(p.cx,q.cx,p.cy);cvV(p.cy,q.cy,q.cx)}
    else{cvV(p.cy,q.cy,p.cx);cvH(p.cx,q.cx,q.cy)}
  }
  return rm;
}
function cvH(x0,x1,y){for(var x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)mp[y][x]=FLOOR}
function cvV(y0,y1,x){for(var y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)mp[y][x]=FLOOR}

function los(x0,y0,x1,y1){
  if(x0===x1&&y0===y1)return 1;
  var dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
  var sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  var er=dx-dy,x=x0,y=y0;
  while(x!==x1||y!==y1){
    if(!(x===x0&&y===y0)&&mp[y][x]===WALL)return 0;
    var e2=2*er;
    if(e2>-dy){er-=dy;x+=sx}
    if(e2<dx){er+=dx;y+=sy}
  }
  return 1;
}
function fov(px,py){
  var y,x;
  for(y=0;y<MH;y++)for(x=0;x<MW;x++)vw[y][x]=0;
  vw[py][px]=1;ex[py][px]=1;
  for(var dy=-FOV;dy<=FOV;dy++)for(var dx=-FOV;dx<=FOV;dx++){
    var tx=px+dx,ty=py+dy;
    if(tx<0||tx>=MW||ty<0||ty>=MH)continue;
    if(dx*dx+dy*dy>FOV*FOV)continue;
    if(los(px,py,tx,ty)){vw[ty][tx]=1;ex[ty][tx]=1}
  }
}

function walk(x,y){return x>=0&&x<MW&&y>=0&&y<MH&&mp[y][x]!==WALL}
function eOn(x,y){for(var i=0;i<en.length;i++)if(en[i].hp>0&&en[i].x===x&&en[i].y===y)return en[i];return null}
function iOn(x,y){for(var i=0;i<it.length;i++)if(it[i].x===x&&it[i].y===y)return it[i];return null}
function eFree(e,x,y){
  if(!walk(x,y))return 0;
  if(x===pl.x&&y===pl.y)return 0;
  for(var i=0;i<en.length;i++)if(en[i]!==e&&en[i].x===x&&en[i].y===y)return 0;
  return 1;
}

function msg(t,cls){ms.push({t:t,c:cls||'n'});if(ms.length>60)ms.shift()}

function fSpot(){
  var cs=[],y,x,i,f;
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    if(mp[y][x]!==FLOOR)continue;
    if(Math.abs(x-pl.x)+Math.abs(y-pl.y)<5)continue;
    f=1;
    for(i=0;i<en.length;i++)if(en[i].x===x&&en[i].y===y)f=0;
    for(i=0;i<it.length;i++)if(it[i].x===x&&it[i].y===y)f=0;
    if(f)cs.push({x:x,y:y});
  }
  return cs.length?pk(cs):null;
}
function initF(){
  var rm=genD(),y;
  vw=[];ex=[];
  for(y=0;y<MH;y++){vw[y]=new Array(MW).fill(0);ex[y]=new Array(MW).fill(0)}
  pl.x=rm[0].cx;pl.y=rm[0].cy;
  mp[rm[rm.length-1].cy][rm[rm.length-1].cx]=STAIRS;
  en=[];
  var nE=ri(5,9),bn=fl-1,i,p,t;
  for(i=0;i<nE;i++){
    p=fSpot();if(!p)break;
    t=pk(ENT);
    en.push({x:p.x,y:p.y,n:t.n,c:t.c,col:t.col,hp:t.hp+bn*5,mhp:t.hp+bn*5,a:t.a+bn*2,xp:t.xp,ch:t.ch});
  }
  it=[];
  var nI=ri(3,7);
  for(i=0;i<nI;i++){
    p=fSpot();if(!p)break;
    t=pk(ITT);
    it.push({x:p.x,y:p.y,n:t.n,c:t.c,col:t.col,ty:t.t,h:t.h,b:t.b});
  }
  fov(pl.x,pl.y);
}

function pAtk(e){
  var d=pl.a+ri(0,4);
  e.hp-=d;
  msg(pl.name+'は'+e.n+'に'+d+'ダメージ','c');
  if(e.hp<=0){
    msg(e.n+'を倒した！','c');
    pl.xp+=e.xp;
    msg('経験値 +'+e.xp,'n');
    while(pl.xp>=pl.xn){
      pl.xp-=pl.xn;pl.lvl++;pl.mhp+=5;
      pl.hp=Math.min(pl.hp+5,pl.mhp);
      pl.a+=2;pl.xn=Math.floor(pl.xn*1.5);
      msg('レベルアップ！ Lv'+pl.lvl,'n');
    }
  }
}
function eAtk(e){
  var d=Math.max(1,e.a+ri(0,3));
  pl.hp-=d;
  msg(e.n+'の攻撃！ '+d+'ダメージ','c');
}

function pMv(dx,dy){
  var nx=pl.x+dx,ny=pl.y+dy;
  if(!walk(nx,ny))return;
  var e=eOn(nx,ny);
  if(e){pAtk(e);endT();return}
  pl.x=nx;pl.y=ny;
  var i=iOn(nx,ny);
  if(i)pickup(i);
  endT();
}
function pickup(i){
  if(pl.inv.length>=9){msg('インベントリ満杯','n');return}
  var cp={};for(var k in i)cp[k]=i[k];
  pl.inv.push(cp);
  it=it.filter(function(t){return t!==i});
  msg(i.n+'を拾った','i');
}
function useInv(n){
  if(n<0||n>=pl.inv.length)return;
  var i=pl.inv[n];
  if(i.ty==='p'){
    var b=pl.hp;
    pl.hp=Math.min(pl.hp+i.h,pl.mhp);
    msg(i.n+'使用: '+(pl.hp-b)+'回復','i');
    pl.inv.splice(n,1);endT();
  }else if(i.ty==='w'){
    pl.a+=i.b;
    msg(i.n+'装備！ ATK+'+i.b,'i');
    pl.inv.splice(n,1);endT();
  }
}
function trySt(){
  if(mp[pl.y][pl.x]!==STAIRS){msg('ここに階段はない','n');return}
  if(fl>=MAXF){
    st='win';
    msg('クリア！地下'+MAXF+'階を踏破！','n');
    return;
  }
  fl++;initF();
  msg('地下'+fl+'階に降りた','n');
}

function endT(){
  en=en.filter(function(e){return e.hp>0});
  var i,e,dx,dy,ad,ax,ay,am,my,d;
  for(i=0;i<en.length;i++){
    if(pl.hp<=0)break;
    e=en[i];
    dx=pl.x-e.x;dy=pl.y-e.y;
    ad=Math.abs(dx)+Math.abs(dy);
    if(ad<=1){eAtk(e);continue}
    if(e.ch&&ad<=12&&los(e.x,e.y,pl.x,pl.y)){
      ax=Math.abs(dx);ay=Math.abs(dy);
      am=ax>0?Math.sign(dx):0;
      my=ay>0?Math.sign(dy):0;
      if(ax>=ay&&am!==0){
        if(eFree(e,e.x+am,e.y))e.x+=am;
        else if(my!==0&&eFree(e,e.x,e.y+my))e.y+=my;
      }else if(my!==0){
        if(eFree(e,e.x,e.y+my))e.y+=my;
        else if(am!==0&&eFree(e,e.x+am,e.y))e.x+=am;
      }
    }else if(!e.ch&&Math.random()<0.25){
      d=[[-1,0],[1,0],[0,-1],[0,1]][ri(0,4)];
      if(eFree(e,e.x+d[0],e.y+d[1])){e.x+=d[0];e.y+=d[1]}
    }
  }
  if(pl.hp<=0&&st==='play'){
    pl.hp=0;st='dead';
    msg('…力尽きてしまった。','n');
    return;
  }
  fov(pl.x,pl.y);
}

function dc(x,y,ch,col){
  ctx.fillStyle=col;
  ctx.font='bold '+(TS-4)+'px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ch,x*TS+TS/2,y*TS+TS/2);
}
function render(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,$c.width,$c.height);
  if(!mp)return;
  var y,x,v,px,py;
  for(y=0;y<MH;y++)for(x=0;x<MW;x++){
    if(!ex[y][x])continue;
    v=vw[y][x];px=x*TS;py=y*TS;
    if(mp[y][x]===WALL){
      ctx.fillStyle=v?'#444':'#1a1a1a';ctx.fillRect(px,py,TS,TS);
      dc(x,y,'#',v?'#666':'#2a2a2a');
    }else if(mp[y][x]===FLOOR){
      ctx.fillStyle=v?'#1e1e1e':'#0d0d0d';ctx.fillRect(px,py,TS,TS);
    }else if(mp[y][x]===STAIRS){
      ctx.fillStyle=v?'#332200':'#0d0d0d';ctx.fillRect(px,py,TS,TS);
      dc(x,y,'>',v?'#ff0':'#664');
    }
  }
  var i;
  for(i=0;i<it.length;i++){if(vw[it[i].y][it[i].x])dc(it[i].x,it[i].y,it[i].c,it[i].col)}
  for(i=0;i<en.length;i++){
    var e=en[i];
    if(vw[e.y][e.x]){
      dc(e.x,e.y,e.c,e.col);
      if(e.hp<e.mhp){
        var bw=TS-4,bh=3,by=Math.max(0,e.y*TS-bh);
        ctx.fillStyle='#800';ctx.fillRect(e.x*TS+2,by,bw,bh);
        ctx.fillStyle='#0f0';ctx.fillRect(e.x*TS+2,by,Math.max(1,Math.round(bw*e.hp/e.mhp)),bh);
      }
    }
  }
  dc(pl.x,pl.y,'@','#fff');
  hud();
}
function hud(){
  var hpc=pl.hp>pl.mhp*0.3?'hi':'lo';
  $st.innerHTML='<b>'+pl.name+'</b><br>HP: <span class="'+hpc+'">'+pl.hp+'/'+pl.mhp+'</span><br>ATK: '+pl.a+'<br>Lv: '+pl.lvl+'　XP: '+pl.xp+'/'+pl.xn+'<br>階数: 地下 '+fl+' / '+MAXF;
  var ih='<b>インベントリ</b><br>',i;
  if(!pl.inv.length){ih+='<span style="color:#555">(空)</span>'}
  else for(i=0;i<pl.inv.length;i++){
    var t=pl.inv[i];
    ih+=(i+1)+'. <span style="color:'+t.col+'">'+t.c+'</span> '+t.n;
    if(t.ty==='p')ih+=' (+'+t.h+'HP)';
    if(t.ty==='w')ih+=' (+'+t.b+'ATK)';
    ih+='<br>';
  }
  $iv.innerHTML=ih;
  var lh='',s=ms.slice(-8),cls;
  for(i=0;i<s.length;i++){
    cls=s[i].c+(i===s.length-1?' latest':'');
    lh+='<div class="'+cls+'">'+s[i].t+'</div>';
  }
  $lg.innerHTML=lh;
}

function showOv(title,html,cls){
  $h1.textContent=title;$h1.className=cls||'';
  $p.innerHTML=html;
  $ov.classList.remove('hide');
}
function hideOv(){$ov.classList.add('hide')}

function startGame(){
  hideOv();st='play';fl=1;ms=[];
  pl={name:'冒険者',x:0,y:0,hp:30,mhp:30,a:5,lvl:1,xp:0,xn:20,inv:[]};
  initF();
  msg('地下'+fl+'階に到着。探索を始めよう','n');
  render();
}

document.addEventListener('keydown',function(e){
  var k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','>','Enter'].indexOf(k)>=0)e.preventDefault();
  if(st==='title'){
    if(k==='Enter'||k===' ')startGame();
    return;
  }
  if(st==='dead'||st==='win'){
    if(k==='r'||k==='R')startGame();
    return;
  }
  switch(k){
    case 'ArrowUp':case 'w':case 'W':pMv(0,-1);break;
    case 'ArrowDown':case 's':case 'S':pMv(0,1);break;
    case 'ArrowLeft':case 'a':case 'A':pMv(-1,0);break;
    case 'ArrowRight':case 'd':case 'D':pMv(1,0);break;
    case 'Enter':case '>':trySt();break;
    case 'r':case 'R':startGame();return;
    default:
      var n=parseInt(k);
      if(n>=1&&n<=9)useInv(n-1);
  }
  render();
  if(st==='dead')showOv('ゲームオーバー','力尽きてしまった…<br><span class="k">R</span> でリトライ','d');
  if(st==='win')showOv('クリア！','地下'+MAXF+'階を踏破しました<br><span class="k">R</span> でリトライ','w');
});

st='title';mp=vw=ex=null;pl=null;en=[];it=[];ms=[];fl=1;
})();
</script>
</body>
</html>

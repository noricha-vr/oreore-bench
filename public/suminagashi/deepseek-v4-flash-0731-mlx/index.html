<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>墨流し</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #efeae0;
            font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .title {
            position: absolute;
            top: 28px;
            left: 32px;
            writing-mode: vertical-rl;
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: #2a2a2a;
            line-height: 1.6;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }
        .caption {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-size: 9px;
            letter-spacing: 0.5em;
            color: rgba(42, 42, 42, 0.45);
            font-weight: 300;
            white-space: nowrap;
        }
        .hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            letter-spacing: 0.6em;
            color: rgba(42, 42, 42, 0.5);
            font-weight: 300;
            transition: opacity 1.5s ease;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
        }
        .hint.hidden {
            opacity: 0;
        }
        .dock {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 10px 22px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.03);
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .swatches {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 500;
            color: #2a2a2a;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            background: rgba(0, 0, 0, 0.04);
            font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
            position: relative;
        }
        .swatch:hover {
            background: rgba(0, 0, 0, 0.08);
        }
        .swatch.active {
            border-color: rgba(42, 42, 42, 0.5);
            box-shadow: 0 0 0 3px rgba(42, 42, 42, 0.1);
        }
        .swatch .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .swatch-sumi .dot {
            background: #1a1a1f;
        }
        .swatch-ai .dot {
            background: #16407a;
        }
        .swatch-shu .dot {
            background: #c8372d;
        }
        .swatch-matsuba .dot {
            background: #2e6e52;
        }
        .swatch-cycle .dot {
            background: conic-gradient(#1a1a1f, #16407a, #c8372d, #2e6e52, #1a1a1f);
        }
        .separator {
            width: 1px;
            height: 24px;
            background: rgba(42, 42, 42, 0.15);
        }
        .toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(42, 42, 42, 0.7);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            transition: background 0.3s;
            font-weight: 400;
        }
        .toggle:hover {
            background: rgba(0, 0, 0, 0.04);
        }
        .toggle .toggle-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: transparent;
            border: 1.5px solid rgba(42, 42, 42, 0.4);
            transition: all 0.3s;
        }
        .toggle.on .toggle-dot {
            background: #2a2a2a;
            border-color: #2a2a2a;
        }
        .wash-btn {
            font-size: 11px;
            color: rgba(42, 42, 42, 0.7);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 20px;
            transition: background 0.3s;
            border: 1px solid rgba(42, 42, 42, 0.1);
            background: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }
        .wash-btn:hover {
            background: rgba(42, 42, 42, 0.06);
        }
        .credit {
            position: absolute;
            bottom: 16px;
            right: 20px;
            font-size: 8px;
            letter-spacing: 0.2em;
            color: rgba(42, 42, 42, 0.3);
            font-weight: 300;
        }
        @media (max-width: 768px) {
            .title {
                top: 20px;
                left: 20px;
                font-size: 22px;
            }
            .caption {
                left: 10px;
                font-size: 7px;
            }
            .dock {
                bottom: 16px;
                padding: 8px 14px;
                gap: 8px;
                border-radius: 30px;
            }
            .swatch {
                width: 28px;
                height: 28px;
                font-size: 9px;
            }
            .toggle {
                font-size: 9px;
            }
            .wash-btn {
                font-size: 9px;
                padding: 3px 8px;
            }
            .hint {
                font-size: 11px;
                letter-spacing: 0.4em;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .hint {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div class="title">墨流し</div>
        <div class="caption">SUMINAGASHI — INK DISSOLUTION</div>
        <div class="hint" id="hint">画 面 を な ぞ っ て 墨 を 流 す</div>
        <div class="dock">
            <div class="swatches">
                <div class="swatch swatch-cycle active" data-color="cycle" title="巡">巡</div>
                <div class="swatch swatch-sumi" data-color="sumi" title="墨"><span class="dot"></span></div>
                <div class="swatch swatch-ai" data-color="ai" title="藍"><span class="dot"></span></div>
                <div class="swatch swatch-shu" data-color="shu" title="朱"><span class="dot"></span></div>
                <div class="swatch swatch-matsuba" data-color="matsuba" title="松葉"><span class="dot"></span></div>
            </div>
            <div class="separator"></div>
            <div class="toggle" id="autoToggle">
                <span class="toggle-dot"></span>
                <span>自動演出</span>
            </div>
            <div class="wash-btn" id="washBtn">洗い流す</div>
        </div>
        <div class="credit">THREE.JS · STABLE FLUIDS</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script>
        // ====== CONFIG ======
        const SIM_WIDTH = 512;
        const SIM_HEIGHT = 512;
        const WASHL_COLOR = new THREE.Color(0xefeae0);
        const INK_ABSORPTIONS = {
            sumi: new THREE.Vector3(2.22, 2.20, 1.97),
            ai: new THREE.Vector3(2.39, 1.30, 0.61),
            shu: new THREE.Vector3(0.178, 1.45, 1.61),
            matsuba: new THREE.Vector3(1.65, 0.757, 1.00)
        };
        const INK_LABELS = { sumi: '墨', ai: '藍', shu: '朱', matsuba: '松葉' };
        const INK_ORDER = ['sumi', 'ai', 'shu', 'matsuba'];

        // ====== STATE ======
        let currentColor = 'cycle';
        let autoPlay = false;
        let washing = false;
        let washTimer = 0;
        let autoDropTimer = 0;
        let cycleTimer = 0;
        let cycleIndex = 0;
        let mousePos = new THREE.Vector2(0.5, 0.5);
        let mousePrev = new THREE.Vector2(0.5, 0.5);
        let mouseVel = new THREE.Vector2(0, 0);
        let mouseDown = false;
        let hasInteracted = false;
        let reducedMotion = false;
        let lastTime = performance.now();
        let autoDropPos = new THREE.Vector2(0.5, 0.5);
        let autoDropActive = false;
        let autoDropTimer2 = 0;

        // ====== RENDERER ======
        const canvas = document.getElementById('canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0xefeae0, 1);

        // ====== SCENE ======
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        // ====== RENDER TARGETS ======
        function createRT(w, h, type) {
            return new THREE.WebGLRenderTarget(w, h, {
                type: type || THREE.HalfFloatType,
                format: THREE.RGBAFormat,
                minFilter: THREE.LinearFilter,
                magFilter: THREE.LinearFilter,
                wrapS: THREE.ClampToEdgeWrapping,
                wrapT: THREE.ClampToEdgeWrapping,
                depthBuffer: false,
                stencilBuffer: false
            });
        }

        const velocityRT0 = createRT(SIM_WIDTH, SIM_HEIGHT);
        const velocityRT1 = createRT(SIM_WIDTH, SIM_HEIGHT);
        const dyeRT0 = createRT(SIM_WIDTH, SIM_HEIGHT);
        const dyeRT1 = createRT(SIM_WIDTH, SIM_HEIGHT);
        const pressureRT0 = createRT(SIM_WIDTH, SIM_HEIGHT);
        const pressureRT1 = createRT(SIM_WIDTH, SIM_HEIGHT);
        const divergenceRT = createRT(SIM_WIDTH, SIM_HEIGHT);

        // Clear initial textures
        function clearRT(rt, r, g, b, a) {
            const oldTarget = renderer.getRenderTarget();
            renderer.setRenderTarget(rt);
            const clearColor = new THREE.Color(r || 0, g || 0, b || 0);
            renderer.setClearColor(clearColor, a || 1);
            renderer.clear();
            renderer.setRenderTarget(oldTarget);
        }
        clearRT(velocityRT0, 0, 0, 0, 1);
        clearRT(velocityRT1, 0, 0, 0, 1);
        clearRT(dyeRT0, 0, 0, 0, 1);
        clearRT(dyeRT1, 0, 0, 0, 1);
        clearRT(pressureRT0, 0, 0, 0, 1);
        clearRT(pressureRT1, 0, 0, 0, 1);
        clearRT(divergenceRT, 0, 0, 0, 1);

        // ====== SHADERS ======
        const commonVert = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position.xy, 0.0, 1.0);
            }
        `;

        // Advection (velocity)
        const advectionFrag = `
            uniform sampler2D uVelocity;
            uniform sampler2D uSource;
            uniform float uDt;
            uniform vec2 uTexelSize;
            uniform float uDecay;
            varying vec2 vUv;
            void main() {
                vec2 vel = texture2D(uVelocity, vUv).xy;
                vec2 pos = vUv - vel * uDt;
                pos = clamp(pos, uTexelSize, 1.0 - uTexelSize);
                vec4 result = texture2D(uSource, pos);
                result.xy *= (1.0 - uDecay);
                gl_FragColor = result;
            }
        `;

        // Vorticity confinement
        const vorticityFrag = `
            uniform sampler2D uVelocity;
            uniform float uDt;
            uniform vec2 uTexelSize;
            varying vec2 vUv;
            
            float getCurl(vec2 uv) {
                vec2 eps = uTexelSize;
                float L = texture2D(uVelocity, uv - vec2(eps.x, 0.0)).y;
                float R = texture2D(uVelocity, uv + vec2(eps.x, 0.0)).y;
                float B = texture2D(uVelocity, uv - vec2(0.0, eps.y)).x;
                float T = texture2D(uVelocity, uv + vec2(0.0, eps.y)).x;
                return (R - L) - (T - B);
            }
            
            void main() {
                vec2 eps = uTexelSize;
                float curl = getCurl(vUv);
                float curlL = getCurl(vUv - vec2(eps.x, 0.0));
                float curlR = getCurl(vUv + vec2(eps.x, 0.0));
                float curlB = getCurl(vUv - vec2(0.0, eps.y));
                float curlT = getCurl(vUv + vec2(0.0, eps.y));
                
                float dCdx = (abs(curlR) - abs(curlL)) / (2.0 * eps.x);
                float dCdy = (abs(curlT) - abs(curlB)) / (2.0 * eps.y);
                
                vec2 grad = vec2(dCdx, dCdy);
                float gradMag = length(grad);
                if (gradMag > 0.001) {
                    grad /= gradMag;
                }
                
                vec2 force = vec2(grad.y * curl, -grad.x * curl) * 0.5;
                vec2 vel = texture2D(uVelocity, vUv).xy;
                gl_FragColor = vec4(vel + force * uDt, 0.0, 0.0);
            }
        `;

        // Divergence
        const divergenceFrag = `
            uniform sampler2D uVelocity;
            uniform vec2 uTexelSize;
            varying vec2 vUv;
            void main() {
                float L = texture2D(uVelocity, vUv - vec2(uTexelSize.x, 0.0)).x;
                float R = texture2D(uVelocity, vUv + vec2(uTexelSize.x, 0.0)).x;
                float B = texture2D(uVelocity, vUv - vec2(0.0, uTexelSize.y)).y;
                float T = texture2D(uVelocity, vUv + vec2(0.0, uTexelSize.y)).y;
                float div = (R - L + T - B) * 0.5;
                gl_FragColor = vec4(div, 0.0, 0.0, 0.0);
            }
        `;

        // Pressure solve (Jacobi)
        const pressureFrag = `
            uniform sampler2D uPressure;
            uniform sampler2D uDivergence;
            uniform vec2 uTexelSize;
            varying vec2 vUv;
            void main() {
                float pL = texture2D(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x;
                float pR = texture2D(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
                float pB = texture2D(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
                float pT = texture2D(uPressure, vUv + vec2(0.0, uTexelSize.y)).x;
                float div = texture2D(uDivergence, vUv).x;
                float p = (pL + pR + pB + pT - div) * 0.25;
                gl_FragColor = vec4(p, 0.0, 0.0, 0.0);
            }
        `;

        // Pressure subtract
        const pressureSubtractFrag = `
            uniform sampler2D uVelocity;
            uniform sampler2D uPressure;
            uniform vec2 uTexelSize;
            varying vec2 vUv;
            void main() {
                vec2 vel = texture2D(uVelocity, vUv).xy;
                float pL = texture2D(uPressure, vUv - vec2(uTexelSize.x, 0.0)).x;
                float pR = texture2D(uPressure, vUv + vec2(uTexelSize.x, 0.0)).x;
                float pB = texture2D(uPressure, vUv - vec2(0.0, uTexelSize.y)).x;
                float pT = texture2D(uPressure, vUv + vec2(0.0, uTexelSize.y)).x;
                vec2 grad = vec2(pR - pL, pT - pB) * 0.5;
                gl_FragColor = vec4(vel - grad, 0.0, 0.0);
            }
        `;

        // Dye advection + injection
        const dyeAdvectionFrag = `
            uniform sampler2D uVelocity;
            uniform sampler2D uDye;
            uniform float uDt;
            uniform vec2 uTexelSize;
            uniform vec2 uMousePos;
            uniform float uMouseDown;
            uniform vec4 uInkColor;
            uniform float uInkAmount;
            uniform float uBrushRadius;
            uniform float uDecay;
            uniform float uWashAmount;
            varying vec2 vUv;
            void main() {
                vec2 vel = texture2D(uVelocity, vUv).xy;
                vec2 pos = vUv - vel * uDt;
                pos = clamp(pos, uTexelSize, 1.0 - uTexelSize);
                vec4 dye = texture2D(uDye, pos);
                
                // Decay
                dye *= (1.0 - uDecay);
                
                // Wash away
                if (uWashAmount > 0.0) {
                    dye *= (1.0 - uWashAmount);
                }
                
                // Add dye at mouse position
                float dist = length(vUv - uMousePos);
                if (dist < uBrushRadius && uMouseDown > 0.5) {
                    float falloff = 1.0 - dist / uBrushRadius;
                    falloff = falloff * falloff;
                    dye += uInkColor * uInkAmount * falloff;
                }
                
                // Clamp
                dye = clamp(dye, 0.0, 2.0);
                
                gl_FragColor = dye;
            }
        `;

        // Display
        const displayFrag = `
            uniform sampler2D uDye;
            uniform vec3 uWashiColor;
            uniform vec3 uInk1Abs;
            uniform vec3 uInk2Abs;
            uniform vec3 uInk3Abs;
            uniform vec3 uInk4Abs;
            uniform float uTime;
            varying vec2 vUv;
            
            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
            }
            
            float noise(vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);
                return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                           mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
            }
            
            void main() {
                vec4 dye = texture2D(uDye, vUv);
                
                vec3 absorption = 
                    dye.r * uInk1Abs +
                    dye.g * uInk2Abs +
                    dye.b * uInk3Abs +
                    dye.a * uInk4Abs;
                
                vec3 color = uWashiColor * exp(-absorption);
                
                // Subtle paper texture
                float n = noise(vUv * 800.0) * 0.015;
                float n2 = noise(vUv * 200.0) * 0.008;
                color += n + n2;
                
                // Subtle vignette
                float dist = length(vUv - 0.5);
                color *= 1.0 - dist * 0.08;
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // ====== MATERIALS ======
        function createMaterial(frag, uniforms) {
            return new THREE.ShaderMaterial({
                vertexShader: commonVert,
                fragmentShader: frag,
                uniforms: uniforms,
                depthWrite: false,
                depthTest: false
            });
        }

        const texelSize = { value: new THREE.Vector2(1.0 / SIM_WIDTH, 1.0 / SIM_HEIGHT) };

        const advectionMat = createMaterial(advectionFrag, {
            uVelocity: { value: null },
            uSource: { value: null },
            uDt: { value: 0.016 },
            uTexelSize: texelSize,
            uDecay: { value: 0.002 }
        });

        const vorticityMat = createMaterial(vorticityFrag, {
            uVelocity: { value: null },
            uDt: { value: 0.016 },
            uTexelSize: texelSize
        });

        const divergenceMat = createMaterial(divergenceFrag, {
            uVelocity: { value: null },
            uTexelSize: texelSize
        });

        const pressureMat = createMaterial(pressureFrag, {
            uPressure: { value: null },
            uDivergence: { value: null },
            uTexelSize: texelSize
        });

        const pressureSubtractMat = createMaterial(pressureSubtractFrag, {
            uVelocity: { value: null },
            uPressure: { value: null },
            uTexelSize: texelSize
        });

        const dyeAdvectionMat = createMaterial(dyeAdvectionFrag, {
            uVelocity: { value: null },
            uDye: { value: null },
            uDt: { value: 0.016 },
            uTexelSize: texelSize,
            uMousePos: { value: new THREE.Vector2(0.5, 0.5) },
            uMouseDown: { value: 0 },
            uInkColor: { value: new THREE.Vector4(1, 0, 0, 0) },
            uInkAmount: { value: 0.02 },
            uBrushRadius: { value: 0.06 },
            uDecay: { value: 0.0005 },
            uWashAmount: { value: 0 }
        });

        const displayMat = createMaterial(displayFrag, {
            uDye: { value: dyeRT0.texture },
            uWashiColor: { value: new THREE.Vector3(0.937, 0.918, 0.878) },
            uInk1Abs: { value: INK_ABSORPTIONS.sumi },
            uInk2Abs: { value: INK_ABSORPTIONS.ai },
            uInk3Abs: { value: INK_ABSORPTIONS.shu },
            uInk4Abs: { value: INK_ABSORPTIONS.matsuba },
            uTime: { value: 0 }
        });

        // ====== QUAD ======
        const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMat);
        scene.add(quad);

        // ====== SIMULATION ======
        function renderToTarget(material, target, clear) {
            const oldTarget = renderer.getRenderTarget();
            renderer.setRenderTarget(target);
            if (clear) {
                renderer.setClearColor(0x000000, 1);
                renderer.clear();
            }
            // Use the quad with the given material
            quad.material = material;
            renderer.render(scene, camera);
            quad.material = displayMat;
            renderer.setRenderTarget(oldTarget);
        }

        function swapRT(a, b) {
            const tmp = a;
            a = b;
            b = tmp;
        }

        let pressureIterations = 20;

        function simulate(dt) {
            // Clamp dt
            dt = Math.min(dt, 0.05);

            // Advect velocity
            advectionMat.uniforms.uVelocity.value = velocityRT0.texture;
            advectionMat.uniforms.uSource.value = velocityRT0.texture;
            advectionMat.uniforms.uDt.value = dt;
            renderToTarget(advectionMat, velocityRT1);

            // Swap
            const tmpV = velocityRT0;
            velocityRT0 = velocityRT1;
            velocityRT1 = tmpV;

            // Vorticity
            vorticityMat.uniforms.uVelocity.value = velocityRT0.texture;
            vorticityMat.uniforms.uDt.value = dt;
            renderToTarget(vorticityMat, velocityRT1);

            // Swap
            const tmpV2 = velocityRT0;
            velocityRT0 = velocityRT1;
            velocityRT1 = tmpV2;

            // Divergence
            divergenceMat.uniforms.uVelocity.value = velocityRT0.texture;
            renderToTarget(divergenceMat, divergenceRT);

            // Pressure solve
            // Clear pressure
            clearRT(pressureRT0, 0, 0, 0, 1);
            clearRT(pressureRT1, 0, 0, 0, 1);

            for (let i = 0; i < pressureIterations; i++) {
                pressureMat.uniforms.uPressure.value = pressureRT0.texture;
                pressureMat.uniforms.uDivergence.value = divergenceRT.texture;
                renderToTarget(pressureMat, pressureRT1);
                // Swap
                const tmpP = pressureRT0;
                pressureRT0 = pressureRT1;
                pressureRT1 = tmpP;
            }

            // Pressure subtract
            pressureSubtractMat.uniforms.uVelocity.value = velocityRT0.texture;
            pressureSubtractMat.uniforms.uPressure.value = pressureRT0.texture;
            renderToTarget(pressureSubtractMat, velocityRT1);

            // Swap
            const tmpV3 = velocityRT0;
            velocityRT0 = velocityRT1;
            velocityRT1 = tmpV3;

            // Dye advection
            dyeAdvectionMat.uniforms.uVelocity.value = velocityRT0.texture;
            dyeAdvectionMat.uniforms.uDye.value = dyeRT0.texture;
            dyeAdvectionMat.uniforms.uDt.value = dt;
            dyeAdvectionMat.uniforms.uMousePos.value.copy(mousePos);
            dyeAdvectionMat.uniforms.uMouseDown.value = mouseDown ? 1.0 : 0.0;
            dyeAdvectionMat.uniforms.uInkColor.value.copy(getInkColor());
            dyeAdvectionMat.uniforms.uInkAmount.value = getInkAmount();
            dyeAdvectionMat.uniforms.uBrushRadius.value = getBrushRadius();
            dyeAdvectionMat.uniforms.uDecay.value = washing ? 0.02 : 0.0003;
            dyeAdvectionMat.uniforms.uWashAmount.value = washing ? 0.01 : 0.0;
            renderToTarget(dyeAdvectionMat, dyeRT1);

            // Swap
            const tmpD = dyeRT0;
            dyeRT0 = dyeRT1;
            dyeRT1 = tmpD;

            // Update display texture
            displayMat.uniforms.uDye.value = dyeRT0.texture;
            displayMat.uniforms.uTime.value = performance.now() / 1000;
        }

        // ====== INK COLOR ======
        function getInkColor() {
            if (currentColor === 'cycle') {
                const c = INK_ORDER[cycleIndex];
                return getInkVector(c);
            }
            return getInkVector(currentColor);
        }

        function getInkVector(color) {
            switch (color) {
                case 'sumi':
                    return new THREE.Vector4(1, 0, 0, 0);
                case 'ai':
                    return new THREE.Vector4(0, 1, 0, 0);
                case 'shu':
                    return new THREE.Vector4(0, 0, 1, 0);
                case 'matsuba':
                    return new THREE.Vector4(0, 0, 0, 1);
                default:
                    return new THREE.Vector4(1, 0, 0, 0);
            }
        }

        function getInkAmount() {
            if (mouseDown) {
                const speed = mouseVel.length();
                return Math.min(0.02 + speed * 0.5, 0.08);
            }
            return 0;
        }

        function getBrushRadius() {
            const base = 0.05;
            const speed = mouseVel.length();
            return base + Math.min(speed * 0.3, 0.04);
        }

        // ====== INTERACTION ======
        function updateMouseFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = 1.0 - (e.clientY - rect.top) / rect.height;
            mousePrev.copy(mousePos);
            mousePos.set(x, y);
            mouseVel.copy(mousePos).sub(mousePrev);
            // Scale velocity by dt factor
            const dt = Math.max(performance.now() - lastTime, 1) / 1000;
            mouseVel.divideScalar(Math.max(dt, 0.001));
            mouseVel.clampLength(0, 5);
        }

        canvas.addEventListener('mousedown', (e) => {
            mouseDown = true;
            updateMouseFromEvent(e);
            hasInteracted = true;
            hideHint();
        });

        canvas.addEventListener('mousemove', (e) => {
            updateMouseFromEvent(e);
            if (mouseDown) {
                hasInteracted = true;
                hideHint();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            mouseDown = false;
            updateMouseFromEvent(e);
        });

        canvas.addEventListener('mouseleave', () => {
            mouseDown = false;
        });

        // Touch
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                mouseDown = true;
                updateMouseFromEvent(touch);
                hasInteracted = true;
                hideHint();
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                updateMouseFromEvent(touch);
                if (mouseDown) {
                    hasInteracted = true;
                    hideHint();
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            mouseDown = false;
        }, { passive: false });

        // ====== UI ======
        function hideHint() {
            const hint = document.getElementById('hint');
            if (hint) {
                hint.classList.add('hidden');
            }
        }

        // Color swatches
        const swatches = document.querySelectorAll('.swatch');
        swatches.forEach(sw => {
            sw.addEventListener('click', (e) => {
                e.stopPropagation();
                const color = sw.dataset.color;
                currentColor = color;
                swatches.forEach(s => s.classList.remove('active'));
                sw.classList.add('active');
                if (color === 'cycle') {
                    cycleTimer = 0;
                    cycleIndex = 0;
                }
                hasInteracted = true;
                hideHint();
            });
        });

        // Auto toggle
        const autoToggle = document.getElementById('autoToggle');
        autoToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            autoPlay = !autoPlay;
            autoToggle.classList.toggle('on', autoPlay);
            if (autoPlay) {
                autoDropTimer = 0;
                autoDropTimer2 = 0;
            }
            hasInteracted = true;
            hideHint();
        });

        // Wash button
        const washBtn = document.getElementById('washBtn');
        washBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            washing = true;
            washTimer = 0;
            hasInteracted = true;
            hideHint();
        });

        // ====== AUTO PLAY ======
        function updateAutoPlay(dt) {
            if (!autoPlay) return;

            autoDropTimer -= dt;
            if (autoDropTimer <= 0) {
                // Drop ink at random position
                autoDropPos.set(Math.random() * 0.6 + 0.2, Math.random() * 0.6 + 0.2);
                autoDropActive = true;
                autoDropTimer = 1.5 + Math.random() * 3.0;
                autoDropTimer2 = 0.3;

                // Add velocity disturbance
                const angle = Math.random() * Math.PI * 2;
                const strength = 0.5 + Math.random() * 0.5;
                // We'll handle this in the dye injection
            }

            if (autoDropActive) {
                autoDropTimer2 -= dt;
                // Simulate mouse down at autoDropPos
                mousePos.copy(autoDropPos);
                mouseDown = true;
                if (autoDropTimer2 <= 0) {
                    autoDropActive = false;
                    mouseDown = false;
                }
            }
        }

        // ====== WASH ======
        function updateWash(dt) {
            if (washing) {
                washTimer += dt;
                if (washTimer > 3.0) {
                    washing = false;
                    washTimer = 0;
                }
            }
        }

        // ====== CYCLE ======
        function updateCycle(dt) {
            if (currentColor === 'cycle') {
                cycleTimer += dt;
                if (cycleTimer > 3.0) {
                    cycleTimer = 0;
                    cycleIndex = (cycleIndex + 1) % INK_ORDER.length;
                }
            }
        }

        // ====== RESIZE ======
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        });

        // ====== REDUCED MOTION ======
        const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        reducedMotion = motionQuery.matches;
        if (reducedMotion) {
            autoPlay = false;
            autoToggle.classList.remove('on');
            pressureIterations = 10;
        }

        // ====== MAIN LOOP ======
        function animate(time) {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Update auto play
            if (!reducedMotion) {
                updateAutoPlay(dt);
            }

            // Update wash
            updateWash(dt);

            // Update cycle
            updateCycle(dt);

            // Simulate
            simulate(dt);

            // Render display
            quad.material = displayMat;
            renderer.setRenderTarget(null);
            renderer.render(scene, camera);
            quad.material = displayMat;
        }

        // ====== INIT ======
        // Set initial mouse position
        mousePos.set(0.5, 0.5);
        mousePrev.set(0.5, 0.5);

        // Start
        requestAnimationFrame(animate);
    </script>
</body>
</html>

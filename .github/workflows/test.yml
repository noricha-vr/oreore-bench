name: Test

# PR ごとに pytest + run.json スキーマ検証を回す（Issue #28）。
# デプロイ（deploy.yml, main push）とは独立させ、テスト失敗を main 到達前に検知する。
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run pytest
        run: uv run --with pytest==8.3.4 pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate run.json schema
        run: node scripts/validate-runs.mjs
